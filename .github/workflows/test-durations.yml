# Per-platform test durations, run on demand from the Actions tab: the times that balance each platform's
# `--test-shard` split (tests/durations/<lane>.tsv; `super-c test` assigns each test, the longest first, to
# the shard with the least time so far).
#
# Each lane runs exactly as the Release workflow tests it: the same runner, compiler build, shard count,
# platform object cache (restored only) and flags, with the shards split by the lane's current times (the
# `test-durations` artifact, .github/actions/test-durations; tests/durations.tsv until a lane has
# them). Each shard records only the tests it ran (`--test-record-durations=<file>`) and passes them on
# as an artifact of this run; the last job merges each lane's shards into its file, uploads them as the
# one `test-durations` artifact that the Release and Debug shards download, deletes every other
# durations artifact (this run's shard parts, the earlier `test-durations`), and prints each lane's
# measured and planned shard times.
#
# A shard whose suite fails still uploads its times, and its job fails after the upload.
name: Test durations
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write # read the durations artifact, and delete the ones the new one replaces
concurrency:
  group: test-durations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    if: github.actor == github.repository_owner
    name: compile (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: ${{ matrix.target }}

      - name: Build the compiler
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          SC_LEAK_CHECK=fatal "./super-c-boot${BINEXT:-}" build --bootstrap-tags ${cstd:+"$cstd"}
          [ -f "./$bin" ] || mv "./super-c" "./$bin" # a bootstrap older than the `.exe` naming fix (release.yml)
          test -x "./$bin"

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-${{ matrix.target }}
          path: super-c${{ env.BINEXT }}
          if-no-files-found: error
          retention-days: 1

  wasm-compile:
    if: github.actor == github.repository_owner
    name: wasm compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: linux

      - name: Build the native and the wasm compiler
        run: |
          set -eu
          SC_LEAK_CHECK=fatal ./super-c-boot build --bootstrap-tags
          ./super-c build --target=wasm --profile=release -o super-c.wasm

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-wasm
          path: |
            super-c
            super-c.wasm
          if-no-files-found: error
          retention-days: 1

  # The Release workflow's test shards (its `test` and `wasm-test` matrices), recording.
  measure:
    needs: [compile, wasm-compile]
    if: github.actor == github.repository_owner
    name: measure (${{ matrix.lane }}, ${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos, lane: macos, test_shard: "1/2", cache_shard: 1 }
          - { os: macos-latest, target: macos, lane: macos, test_shard: "2/2", cache_shard: 2 }
          - { os: ubuntu-latest, target: linux, lane: linux, test_shard: "1/2", cache_shard: 1 }
          - { os: ubuntu-latest, target: linux, lane: linux, test_shard: "2/2", cache_shard: 2 }
          - { os: windows-latest, target: windows, lane: windows, test_shard: "1/3", cache_shard: 1 }
          - { os: windows-latest, target: windows, lane: windows, test_shard: "2/3", cache_shard: 2 }
          - { os: windows-latest, target: windows, lane: windows, test_shard: "3/3", cache_shard: 3 }
          - { os: ubuntu-latest, target: wasm, lane: wasm, test_shard: "1/2", cache_shard: 1 }
          - { os: ubuntu-latest, target: wasm, lane: wasm, test_shard: "2/2", cache_shard: 2 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      - uses: ./.github/actions/test-durations

      - name: Run the shard, recording its times
        id: run
        run: |
          set -u
          bin="super-c${BINEXT:-}"
          chmod +x "./$bin"
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          dur="tests/durations/${{ matrix.lane }}.tsv"
          [ -f "$dur" ] || dur=tests/durations.tsv
          k="${{ matrix.test_shard }}"
          out="durations-${{ matrix.lane }}-${k%/*}.tsv"
          rm -f "$out"
          if [ "${{ matrix.target }}" = wasm ]; then
            export SC_TEST_SUPERC="$GITHUB_WORKSPACE/ci/wasm-superc.sh"
          fi
          start=$(date +%s)
          SC_LEAK_CHECK=fatal "./$bin" test --sanitizers --quiet --test-shard="$k" --test-durations="$dur" \
            --test-record-durations="$out" ${cstd:+"$cstd"}
          status=$?
          echo "wall=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          test -s "$out"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: durations-shard-${{ matrix.lane }}-${{ matrix.cache_shard }}
          path: durations-${{ matrix.lane }}-*.tsv
          if-no-files-found: error
          retention-days: 1

      - name: Fail on a failed suite
        if: steps.run.outputs.status != '0'
        run: |
          echo "the shard's suite failed (exit ${{ steps.run.outputs.status }}); its times were uploaded"
          exit 1

  collect:
    needs: measure
    if: always() && github.actor == github.repository_owner
    name: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/test-durations-save
        with:
          shards: macos=2 linux=2 windows=3 wasm=2
