# The permanent probe lane: whatever currently needs proving on a real runner lives here as the job
# content, run on demand from the Actions tab. Edit the jobs for the next investigation; do not remove
# the file. Current probe: this tree's compiler on every platform with a native backend (macOS arm64,
# Linux x86-64, Linux arm64, Windows x86-64): the test suite, leak-gated, in the release's shards, and
# the self-compile benchmark, whose per-phase heap (MiB) must agree across the platforms. Then what
# the comparison and layout work costs and gains on each runner's processor: the cost of running a short
# function or loop across an address boundary (`boundary`), the code generation suite against the C
# kernels (`codegen`), and this tree's compiler against its parent commit's, second generation each: code
# size and the time of one native build (`text`).
name: Debug
on:
  workflow_dispatch
permissions:
  contents: read
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    name: compile (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux }
          # No release ships a Linux arm64 compiler: the x86-64 runner cross-builds it against the arm64
          # C library. Both runners run Ubuntu 26.04: the arm64 runner's glibc.
          - { os: ubuntu-26.04, target: linux_arm64, platform: linux }
          - { os: windows-latest, target: windows }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: ${{ matrix.platform || matrix.target }}

      - name: Build the compiler
        run: |
          set -eu
          SC_LEAK_CHECK=fatal "./super-c-boot${BINEXT:-}" build --bootstrap-tags
          test -x "./super-c${BINEXT:-}"

      - name: Cross-build the arm64 compiler
        if: matrix.target == 'linux_arm64'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y libc6-dev-arm64-cross
          SC_LEAK_CHECK=fatal ./super-c build --target=linux --arch=aarch64 --sysroot=/usr/aarch64-linux-gnu --out-dir=build-a64 -o super-c-a64
          mv super-c-a64 super-c

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-${{ matrix.target }}
          path: super-c${{ env.BINEXT }}
          if-no-files-found: error
          retention-days: 1

  # What a short function, or the short loop that calls it, costs when a boundary of 64 to 65536 bytes
  # falls inside it, on this runner's processor (ci/boundary_cost.c places the machine code itself).
  # The code generation suite: each kernel as this tree compiles it against the runner's C compiler at -O2.
  codegen:
    needs: compile
    name: codegen suite (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux }
          - { os: windows-latest, target: windows }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      # The parent commit's compiler, built by this tree's: the same runner times the kernels of both.
      - name: Code generation suite
        run: |
          set -euo pipefail
          x="${BINEXT:-}"
          native() { if command -v cygpath >/dev/null 2>&1; then cygpath -m "$1"; else echo "$1"; fi; }
          here="$(native "$PWD")"
          chmod +x "./super-c$x"
          git worktree add -q ../parent HEAD~1
          mkdir -p ../gen
          gen="$(native "$(cd ../gen && pwd)")"
          export SC_NO_CACHE=1 SC_NO_EMIT_CACHE=1 SC_NO_TU_CACHE=1
          ( cd ../parent && SC_STD_DIR="$(native "$PWD")/std" "$here/super-c$x" build --profile=release --out-dir="$gen/p-o" -o "$gen/parent$x" >"$gen/parent.log" 2>&1 ) \
            || { tail -20 "$gen/parent.log" || true; echo "BUILD FAILED: parent"; exit 1; }
          cp "./super-c$x" "$gen/new$x"
          export SC_STD_DIR="$here/std"
          sh bench/codegen/lib.sh
          {
            (grep -m1 'model name' /proc/cpuinfo || sysctl -n machdep.cpu.brand_string || wmic cpu get name || lscpu | grep -m1 'Model name') 2>/dev/null | head -2
            for r in 1 2; do
              for n in parent new; do
                echo "== $n round $r"
                "$gen/$n$x" bench --filter=codegen_
                cp "build/bench-bin$x" "bench-$n$x"
              done
            done
          } | tee codegen-${{ matrix.target }}.txt

      - uses: actions/upload-artifact@v7
        with:
          name: codegen-${{ matrix.target }}
          path: |
            codegen-${{ matrix.target }}.txt
            bench-parent*
            bench-new*
          if-no-files-found: error
          retention-days: 3

  # Linux arm64: each variant of the tree, built by the artifact without optimization, builds itself with
  # optimization; that compiler then builds itself. A failure prints the log and a debugger's backtrace.
  diagnose:
    needs: compile
    name: arm64 self-build (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        variant: [tree, nokeep, nojoin, nobool, dd390676, 536da004, e0c573a1]
    runs-on: ubuntu-26.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/toolchain
        with:
          target: linux_arm64
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-linux_arm64

      - name: Self-build
        run: |
          set -euo pipefail
          v="${{ matrix.variant }}"
          here="$PWD"
          chmod +x ./super-c
          mkdir -p ../gen
          gen="$(cd ../gen && pwd)"
          src="$here"
          edit() { python3 - "$1" "$2" "$3" <<'PY'
          import sys
          p, a, b = sys.argv[1:4]
          s = open(p).read()
          assert s.count(a) == 1, (p, a, s.count(a))
          open(p, "w").write(s.replace(a, b))
          PY
          }
          case "$v" in
            tree) ;;
            nokeep) edit src/link/elf.spc 'at += lu::keep_pad(b[sc.off..sc.off + sc.size as usize], addr + at, sc.align.max(4), lu::KEEP_LINE);' 'at += 0 * b.len() as u64;' ;;
            nojoin) edit src/codegen/live.spc 'const FOLD_FJOIN: u64 = 36028797018963968;' 'const FOLD_FJOIN: u64 = 0;' ;;
            nobool) edit src/lir/ir.spc 'return (b.pool[t.b as usize + 2] & (AGG | SIG_BOOL)) == SIG_BOOL;' 'return (b.pool[t.b as usize + 2] & (AGG | SIG_BOOL)) == SIG_BOOL && b.pool.len() == 0;' ;;
            *) git worktree add -q ../v "$v"; src="$(cd ../v && pwd)" ;;
          esac
          export SC_NO_CACHE=1 SC_NO_EMIT_CACHE=1 SC_NO_TU_CACHE=1
          cd "$src"
          export SC_STD_DIR="$src/std"
          "$here/super-c" build --out-dir="$gen/o-dbg" -o "$gen/v-dbg" >"$gen/dbg.log" 2>&1 \
            || { tail -n 30 "$gen/dbg.log"; echo "RESULT $v: the build without optimization FAILED"; exit 1; }
          "$gen/v-dbg" build --profile=release --out-dir="$gen/o-rel" -o "$gen/v-rel" >"$gen/rel.log" 2>&1 \
            || { tail -n 30 "$gen/rel.log"; echo "RESULT $v: the optimized build by the unoptimized compiler FAILED"; exit 1; }
          if "$gen/v-rel" build --profile=release --out-dir="$gen/o-2" -o "$gen/v-2" >"$gen/self.log" 2>&1; then
            echo "RESULT $v: self-build OK"
            if cmp -s "$gen/v-rel" "$gen/v-2"; then echo "RESULT $v: fixpoint OK"; else echo "RESULT $v: fixpoint DIFFERS"; fi
          else
            echo "RESULT $v: self-build FAILED (exit $?)"
            tail -n 30 "$gen/self.log" || true
            sudo apt-get install -y gdb >/dev/null 2>&1 || true
            rm -rf "$gen/o-2"
            gdb -batch -ex run -ex bt -ex 'info registers' -ex 'x/16i $pc-40' --args "$gen/v-rel" build --profile=release --out-dir="$gen/o-2" -o "$gen/v-2" 2>&1 | tail -n 70 || true
            exit 1
          fi
