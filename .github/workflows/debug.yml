# The permanent probe lane: whatever currently needs proving on a real runner lives here as the job
# content, run on demand from the Actions tab. Edit the job for the next investigation; do not remove
# the file. Current probe: the optimized LIR and the machine code of the compiler's own release build on
# macOS (arm64), Linux (x86-64 and arm64) and Windows (x86-64), for a review of missed optimizations.
# Each dump is a cold release build (no per-unit or emission cache) with `SC_LIR_PRINT=_`, which prints
# every optimized body whose name holds `_` (all but `main`), and a disassembly of every object it wrote.
# Linux arm64 has no release compiler yet: the x86-64 runner cross-builds one against the arm64 C
# library, and the arm64 runner dumps with it.
name: Debug
on:
  workflow_dispatch
permissions:
  contents: read
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dump:
    name: dump (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - name: Clean release outputs
        run: rm -rf build src/build ci/build super-c super-c.exe* super-c-boot* smoke*

      - uses: ./.github/actions/bootstrap
        with:
          target: ${{ matrix.target }}

      - name: Build the compiler
        run: |
          set -eu
          SC_LEAK_CHECK=fatal "./super-c-boot${BINEXT:-}" build --bootstrap-tags
          test -x "./super-c${BINEXT:-}"

      - name: Dump the LIR and the machine code
        run: sh ci/dump.sh "./super-c${BINEXT:-}" dump-${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: dump-${{ matrix.target }}
          path: dump-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  linux-arm64-compile:
    name: linux arm64 compile
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: linux
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: linux

      - name: Cross-build an arm64 compiler
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y libc6-dev-arm64-cross
          SC_LEAK_CHECK=fatal ./super-c-boot build --bootstrap-tags
          SC_LEAK_CHECK=fatal ./super-c build --target=linux --arch=aarch64 --sysroot=/usr/aarch64-linux-gnu --out-dir=build-a64 -o super-c-a64

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-linux-arm64-boot
          path: super-c-a64
          if-no-files-found: error
          retention-days: 1

  linux-arm64-dump:
    needs: linux-arm64-compile
    name: dump (linux-arm64)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: compiler-linux-arm64-boot

      - name: Dump the LIR and the machine code
        run: |
          set -eu
          chmod +x super-c-a64
          sh ci/dump.sh ./super-c-a64 dump-linux-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: dump-linux-arm64
          path: dump-linux-arm64
          if-no-files-found: error
          retention-days: 7
