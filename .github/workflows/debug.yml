# The permanent probe lane: whatever currently needs proving on a real runner lives here as the job
# content, run on demand from the Actions tab. Edit the job for the next investigation; do not remove
# the file. Current probe: the Windows test suite (quiet run, failures replay streams straight into
# the job log), a verbose Linux run with a stuck-program watchdog, plus the release workflow's wasm leg
# without its self-host fixpoint (the release workflow keeps it).
# Each platform builds its compiler once (`*-compile`) and runs the two test shards in parallel on it.
name: Debug
on:
  workflow_dispatch
permissions:
  contents: read
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-compile:
    name: windows compile
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: windows
          cache: ccache-windows-build
          sha: ${{ github.sha }}
          cstd: -std=gnu11 -D_POSIX_C_SOURCE=200809L -g1

      - uses: ./.github/actions/bootstrap
        with:
          target: windows

      - name: Build the compiler
        run: |
          set -eu
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          SC_LEAK_CHECK=fatal "./super-c-boot${BINEXT:-}" build --bootstrap-tags ${cstd:+"$cstd"}
          bin="super-c${BINEXT:-}"
          [ -f "./$bin" ] || mv "./super-c" "./$bin"
          test -x "./$bin"

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-windows
          path: super-c.exe
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: windows-compile
    name: windows (tests ${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_shard: "1/2"
            cache_shard: 1
          - test_shard: "2/2"
            cache_shard: 2
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: windows
          cache: ccache-windows-${{ matrix.cache_shard }}
          sha: ${{ github.sha }}
          cstd: -std=gnu11 -D_POSIX_C_SOURCE=200809L -g1

      - name: Exclude work dirs from Defender
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
          Add-MpPreference -ExclusionProcess "gcc.exe"
          Add-MpPreference -ExclusionProcess "ld.exe"
          Add-MpPreference -ExclusionProcess "super-c.exe"

      - uses: actions/download-artifact@v8
        with:
          name: compiler-windows

      # The io idle-descriptor test alone and in-process first, so its own progress lines reach the job
      # log live and a hang stops at the timeout with the last line telling where it stopped.
      - name: Probe the io idle-descriptor test (in-process, bounded)
        run: |
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          for i in 1 2 3; do
            echo "### probe $i"
            SC_LEAK_CHECK=fatal timeout 180 "./super-c${BINEXT:-}" test --test-no-fork --filter=idle_descriptors_do_not_delay ${cstd:+"$cstd"} || echo "### probe $i exit $?"
          done

      - name: Run the test suite (leak-gated, bounded)
        run: |
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          SC_LEAK_CHECK=fatal timeout 1200 "./super-c${BINEXT:-}" test --test-shard=${{ matrix.test_shard }} ${cstd:+"$cstd"}

  linux-compile:
    name: linux compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: linux
          cache: ccache-linux-build
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: linux

      - name: Build the compiler
        run: SC_LEAK_CHECK=fatal ./super-c-boot build --bootstrap-tags

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-linux
          path: super-c
          if-no-files-found: error
          retention-days: 1

  # Linux, verbose, with a watchdog: a compiled test program alive for over a minute is named (its
  # project's main.spc and every thread's kernel wait channel) and killed so the run finishes.
  linux:
    needs: linux-compile
    name: linux (tests ${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_shard: "1/2"
            cache_shard: 1
          - test_shard: "2/2"
            cache_shard: 2
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: linux
          cache: ccache-linux-${{ matrix.cache_shard }}
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-linux

      - name: Make the compiler executable
        run: chmod +x ./super-c

      - name: Run the test suite (verbose, watchdog)
        run: |
          set -u
          (
            while true; do
              for p in $(pgrep -x bin); do
                et=$(ps -o etimes= -p "$p" 2>/dev/null | tr -d ' '); [ -z "$et" ] && continue
                if [ "$et" -gt 60 ]; then
                  # The program, the shell that ran it and the test process above that: state, threads
                  # and kernel wait channels of each, so a hang in the caller shows as well as one in
                  # the program. `readlink -f /proc/$p/exe` names the project the program came from.
                  echo "### STUCK bin pid=$p etime=$et exe=$(readlink -f "/proc/$p/exe" 2>/dev/null)"
                  q=$p
                  for lvl in program shell test; do
                    [ -d "/proc/$q" ] || break
                    echo "### $lvl pid=$q $(grep -E '^(Name|State|PPid):' "/proc/$q/status" 2>/dev/null | tr '\n' ' ')"
                    for t in /proc/$q/task/*; do
                      echo "  $(basename "$t") $(cut -d' ' -f3 "$t/stat" 2>/dev/null) $(cat "$t/wchan" 2>/dev/null)"
                      sudo cat "$t/stack" 2>/dev/null | head -8 | sed 's/^/    /'
                    done
                    q=$(awk '/^PPid:/ { print $2 }' "/proc/$q/status" 2>/dev/null)
                  done
                  kill -9 "$p" 2>/dev/null || echo "### kill -9 $p failed: $?"
                fi
              done
              sleep 10
            done
          ) &
          wd=$!
          SC_LEAK_CHECK=fatal timeout 1500 ./super-c test --test-shard=${{ matrix.test_shard }}
          rc=$?
          kill "$wd" 2>/dev/null || true
          exit "$rc"

  wasm-compile:
    name: wasm compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          cache: ccache-wasm-build
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: linux

      - name: Build the native compiler
        run: SC_LEAK_CHECK=fatal ./super-c-boot build --bootstrap-tags

      # The build engine cross-compiles with the wasi-sdk (sysroot, emulation libraries, stack size).
      - name: Build the wasm compiler
        run: ./super-c build --target=wasm --profile=release -o super-c.wasm

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-wasm
          path: |
            super-c
            super-c.wasm
          if-no-files-found: error
          retention-days: 1

      - name: Package
        run: |
          set -eu
          name="super-c-wasm32-wasip1"
          mkdir -p "dist/${name}"
          cp super-c.wasm "dist/${name}/"
          cp -R std ffi "dist/${name}/"
          tar -C dist -czf "${name}.tar.gz" "${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: super-c-wasm32-wasip1.tar.gz
          if-no-files-found: error

  wasm:
    needs: wasm-compile
    name: wasm (tests ${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_shard: "1/2"
            cache_shard: 1
          - test_shard: "2/2"
            cache_shard: 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          cache: ccache-wasm-${{ matrix.cache_shard }}
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-wasm

      - name: Run the test suite against the wasm compiler
        run: |
          chmod +x ./super-c
          SC_TEST_SUPERC="$GITHUB_WORKSPACE/ci/wasm-superc.sh" SC_LEAK_CHECK=fatal ./super-c test --test-shard=${{ matrix.test_shard }}
