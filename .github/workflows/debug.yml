# The permanent probe lane: whatever currently needs proving on a real runner lives here as the job
# content, run on demand from the Actions tab. Edit the job for the next investigation; do not remove
# the file. Current probe: the Windows test suite (quiet run, failures replay streams straight into
# the job log), a verbose Linux run with a stuck-program watchdog, plus the release workflow's wasm leg
# without its self-host fixpoint (the release workflow keeps it), the native backend against the C
# pipeline on macOS, Linux and Windows (`speed`, ci/speed.sh), with the release's transpile counts, and
# the suite with no C compiler and no linker on every target (`*-nocc`).
# Each platform builds its compiler once (`*-compile`) and runs its test shards in parallel on it (three
# on Windows, the slowest runner, two elsewhere); Linux arm64 builds its compiler on the arm64 runner from
# one the x86-64 runner cross-builds. It restores the release workflow's caches and saves none.
name: Debug
on:
  workflow_dispatch
permissions:
  contents: read
  actions: read # the test-durations artifact (.github/actions/test-durations)
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-compile:
    name: windows compile
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: windows
          sha: ${{ github.sha }}
          cstd: -std=gnu11 -D_POSIX_C_SOURCE=200809L -g1

      - uses: ./.github/actions/bootstrap
        with:
          target: windows

      - name: Build the compiler
        run: |
          set -eu
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          SC_LEAK_CHECK=fatal "./super-c-boot${BINEXT:-}" build --bootstrap-tags ${cstd:+"$cstd"}
          bin="super-c${BINEXT:-}"
          [ -f "./$bin" ] || mv "./super-c" "./$bin"
          test -x "./$bin"

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-windows
          path: super-c.exe
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: windows-compile
    name: windows (tests ${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_shard: "1/3"
            cache_shard: 1
          - test_shard: "2/3"
            cache_shard: 2
          - test_shard: "3/3"
            cache_shard: 3
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: windows
          sha: ${{ github.sha }}
          cstd: -std=gnu11 -D_POSIX_C_SOURCE=200809L -g1

      - name: Exclude work dirs from Defender
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
          Add-MpPreference -ExclusionProcess "gcc.exe"
          Add-MpPreference -ExclusionProcess "ld.exe"
          Add-MpPreference -ExclusionProcess "super-c.exe"

      - uses: actions/download-artifact@v8
        with:
          name: compiler-windows

      # The io idle-descriptor test alone and in-process first, so its own progress lines reach the job
      # log live and a hang stops at the timeout with the last line telling where it stopped.
      - name: Probe the io idle-descriptor test (in-process, bounded)
        run: |
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          for i in 1 2 3; do
            echo "### probe $i"
            SC_LEAK_CHECK=fatal timeout 180 "./super-c${BINEXT:-}" test --sanitizers --test-no-fork --filter=idle_descriptors_do_not_delay ${cstd:+"$cstd"} || echo "### probe $i exit $?"
          done

      - uses: ./.github/actions/test-durations

      - name: Run the test suite (leak-gated, bounded)
        run: |
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          dur=tests/durations/windows.tsv; [ -f "$dur" ] || dur=tests/durations.tsv # shard balance (test-durations.yml)
          SC_LEAK_CHECK=fatal timeout 1200 "./super-c${BINEXT:-}" test --sanitizers --test-shard=${{ matrix.test_shard }} --test-durations="$dur" ${cstd:+"$cstd"}

      - name: Defender's detections
        if: failure()
        shell: powershell
        run: |
          Get-MpThreatDetection | Format-List
          Get-MpThreat | Format-List

  linux-compile:
    name: linux compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: linux
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: linux

      - name: Build the compiler
        run: SC_LEAK_CHECK=fatal ./super-c-boot build --bootstrap-tags

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-linux
          path: super-c
          if-no-files-found: error
          retention-days: 1

  # Linux, verbose, with a watchdog: a compiled test program alive for over a minute is named (its
  # project's main.spc and every thread's kernel wait channel) and killed so the run finishes.
  linux:
    needs: linux-compile
    name: linux (tests ${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_shard: "1/2"
            cache_shard: 1
          - test_shard: "2/2"
            cache_shard: 2
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: linux
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-linux

      - name: Make the compiler executable
        run: chmod +x ./super-c

      - uses: ./.github/actions/test-durations

      - name: Run the test suite (verbose, watchdog)
        run: |
          set -u
          (
            while true; do
              for p in $(pgrep -x bin); do
                et=$(ps -o etimes= -p "$p" 2>/dev/null | tr -d ' '); [ -z "$et" ] && continue
                if [ "$et" -gt 60 ]; then
                  # The program, the shell that ran it and the test process above that: state, threads
                  # and kernel wait channels of each, so a hang in the caller shows as well as one in
                  # the program. `readlink -f /proc/$p/exe` names the project the program came from.
                  echo "### STUCK bin pid=$p etime=$et exe=$(readlink -f "/proc/$p/exe" 2>/dev/null)"
                  q=$p
                  for lvl in program shell test; do
                    [ -d "/proc/$q" ] || break
                    echo "### $lvl pid=$q $(grep -E '^(Name|State|PPid):' "/proc/$q/status" 2>/dev/null | tr '\n' ' ')"
                    for t in /proc/$q/task/*; do
                      echo "  $(basename "$t") $(cut -d' ' -f3 "$t/stat" 2>/dev/null) $(cat "$t/wchan" 2>/dev/null)"
                      sudo cat "$t/stack" 2>/dev/null | head -8 | sed 's/^/    /'
                    done
                    q=$(awk '/^PPid:/ { print $2 }' "/proc/$q/status" 2>/dev/null)
                  done
                  kill -9 "$p" 2>/dev/null || echo "### kill -9 $p failed: $?"
                fi
              done
              sleep 10
            done
          ) &
          wd=$!
          dur=tests/durations/linux.tsv; [ -f "$dur" ] || dur=tests/durations.tsv # shard balance (test-durations.yml)
          SC_LEAK_CHECK=fatal timeout 1500 ./super-c test --sanitizers --test-shard=${{ matrix.test_shard }} --test-durations="$dur"
          rc=$?
          kill "$wd" 2>/dev/null || true
          exit "$rc"

  # Linux arm64, the native arm64 backend's ELF target. No release ships a Linux arm64 compiler yet:
  # the x86-64 runner cross-builds one through C with GCC's aarch64 cross compiler, and the arm64
  # runner builds the compiler with it in two stages, the second through the native backend. Both run
  # Ubuntu 26.04: one glibc, and a clang that knows the FP8 types of the bundled `arm_neon.h`.
  linux-arm64-compile:
    name: linux arm64 compile
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: linux
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: linux

      - name: Cross-build an arm64 compiler through C
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          SC_LEAK_CHECK=fatal ./super-c-boot build --bootstrap-tags
          SC_NATIVE=0 ./super-c build --target=linux --arch=aarch64 --cc=aarch64-linux-gnu-gcc --out-dir=build-a64 -o super-c-a64

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-linux-arm64-boot
          path: super-c-a64
          if-no-files-found: error
          retention-days: 1

  linux-arm64:
    needs: linux-arm64-compile
    name: linux arm64 (tests ${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        test_shard: ["1/2", "2/2"]
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: linux-arm64
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-linux-arm64-boot

      - name: Build the compiler natively
        run: |
          set -eu
          chmod +x super-c-a64
          SC_LEAK_CHECK=fatal ./super-c-a64 build --bootstrap-tags -o stage1-super-c
          SC_LEAK_CHECK=fatal ./stage1-super-c build
          rm -f stage1-super-c super-c-a64
          test -x ./super-c

      - name: Run the test suite
        run: SC_LEAK_CHECK=fatal timeout 1500 ./super-c test --sanitizers --test-shard=${{ matrix.test_shard }}

  wasm-compile:
    name: wasm compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: linux

      - name: Build the native compiler
        run: SC_LEAK_CHECK=fatal ./super-c-boot build --bootstrap-tags

      # The build engine cross-compiles with the wasi-sdk (sysroot, emulation libraries, stack size).
      - name: Build the wasm compiler
        run: ./super-c build --target=wasm --profile=release -o super-c.wasm

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-wasm
          path: |
            super-c
            super-c.wasm
          if-no-files-found: error
          retention-days: 1

      - name: Package
        run: |
          set -eu
          name="super-c-wasm32-wasip1"
          mkdir -p "dist/${name}"
          cp super-c.wasm "dist/${name}/"
          cp -R std ffi "dist/${name}/"
          tar -C dist -czf "${name}.tar.gz" "${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: super-c-wasm32-wasip1.tar.gz
          if-no-files-found: error

  wasm:
    needs: wasm-compile
    name: wasm (tests ${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_shard: "1/2"
            cache_shard: 1
          - test_shard: "2/2"
            cache_shard: 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-wasm

      - uses: ./.github/actions/test-durations

      - name: Run the test suite against the wasm compiler
        run: |
          chmod +x ./super-c
          dur=tests/durations/wasm.tsv; [ -f "$dur" ] || dur=tests/durations.tsv # shard balance (test-durations.yml)
          SC_TEST_SUPERC="$GITHUB_WORKSPACE/ci/wasm-superc.sh" SC_LEAK_CHECK=fatal ./super-c test --sanitizers --test-shard=${{ matrix.test_shard }} --test-durations="$dur"

  # No C compiler and no linker: the native backends and the own linkers build the compiler with the
  # compile job's one and run the suite with it; a test that compiles C itself returns early
  # (`cli::has_cc`). Linux runs in an image with the C library's headers alone (`libc6-dev`, where the
  # header facts come from) and git (the vendor tests); macOS and Windows leave their preinstalled C
  # tools unused through a CC that names no file.
  linux-nocc:
    needs: linux-compile
    name: linux no cc (tests ${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        test_shard: ["1/2", "2/2"]
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install the C headers and git, no compiler or linker
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libc6-dev git ca-certificates
          for t in cc gcc clang ld; do
            if command -v "$t"; then exit 1; fi
          done

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: compiler-linux

      - name: Build the compiler with itself
        run: |
          set -eu
          chmod +x super-c
          mv super-c super-c-boot
          SC_LEAK_CHECK=fatal ./super-c-boot build
          test -x ./super-c

      - name: Run the test suite
        run: SC_NATIVE_LOG="$RUNNER_TEMP/native.log" SC_LEAK_CHECK=fatal timeout 1500 ./super-c test --test-shard=${{ matrix.test_shard }}

      - name: The modules that went through C
        if: failure()
        run: cat "$RUNNER_TEMP/native.log" || true

  linux-arm64-nocc:
    needs: linux-arm64-compile
    name: linux arm64 no cc (tests ${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        test_shard: ["1/2", "2/2"]
    runs-on: ubuntu-26.04-arm
    container: ubuntu:26.04
    steps:
      - name: Install the C headers and git, no compiler or linker
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libc6-dev git ca-certificates
          for t in cc gcc clang ld; do
            if command -v "$t"; then exit 1; fi
          done

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: compiler-linux-arm64-boot

      - name: Build the compiler with itself
        run: |
          set -eu
          chmod +x super-c-a64
          mv super-c-a64 super-c-boot
          SC_LEAK_CHECK=fatal ./super-c-boot build
          test -x ./super-c

      - name: Run the test suite
        run: SC_NATIVE_LOG="$RUNNER_TEMP/native.log" SC_LEAK_CHECK=fatal timeout 1500 ./super-c test --test-shard=${{ matrix.test_shard }}

      - name: The modules that went through C
        if: failure()
        run: cat "$RUNNER_TEMP/native.log" || true

  macos-nocc:
    name: macos no cc (tests ${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        test_shard: ["1/2", "2/2"]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: macos
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: macos

      - name: Build the compiler through C, then with itself without it
        run: |
          set -eu
          SC_LEAK_CHECK=fatal ./super-c-boot build --bootstrap-tags -o super-c-cc
          CC=/nonexistent/cc SC_LEAK_CHECK=fatal ./super-c-cc build
          rm -f super-c-cc
          test -x ./super-c

      # macOS has no `timeout`: the job's own limit bounds the run.
      - name: Run the test suite
        timeout-minutes: 30
        env:
          CC: /nonexistent/cc
        run: SC_NATIVE_LOG="$RUNNER_TEMP/native.log" SC_LEAK_CHECK=fatal ./super-c test --test-shard=${{ matrix.test_shard }}

      - name: The modules that went through C
        if: failure()
        run: cat "$RUNNER_TEMP/native.log" || true

  windows-nocc:
    needs: windows-compile
    name: windows no cc (tests ${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        test_shard: ["1/3", "2/3", "3/3"]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CC: C:/nonexistent/cc.exe
      BINEXT: .exe
    steps:
      - uses: actions/checkout@v7

      - name: Exclude work dirs from Defender
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
          Add-MpPreference -ExclusionProcess "super-c.exe"

      - uses: actions/download-artifact@v8
        with:
          name: compiler-windows

      - name: Build the compiler with itself
        run: |
          set -eu
          mv super-c.exe super-c-boot.exe
          SC_LEAK_CHECK=fatal ./super-c-boot.exe build
          test -x ./super-c.exe

      - name: Run the test suite
        run: SC_NATIVE_LOG="$RUNNER_TEMP/native.log" SC_LEAK_CHECK=fatal timeout 1500 ./super-c.exe test --test-shard=${{ matrix.test_shard }}

      - name: The modules that went through C
        if: failure()
        run: cat "$RUNNER_TEMP/native.log" || true

      - name: Defender's detections
        if: failure()
        shell: powershell
        run: |
          Get-MpThreatDetection | Format-List
          Get-MpThreat | Format-List

  # The wasm leg without the wasi-sdk: its sysroot (headers and C library, no compiler) for the header
  # facts and wasmtime to run the compiler.
  wasm-nocc:
    needs: linux-compile
    name: wasm no cc (tests ${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        test_shard: ["1/2", "2/2"]
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install the C headers, git, the WASI sysroot and wasmtime, no compiler or linker
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libc6-dev git ca-certificates curl xz-utils
          curl -sSfL -o /tmp/wasi-sysroot.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sysroot-25.0.tar.gz
          mkdir -p /opt/wasi-sysroot
          tar -xzf /tmp/wasi-sysroot.tar.gz -C /opt/wasi-sysroot --strip-components=1
          curl -sSfL -o /tmp/wasmtime.tar.xz \
            https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.2/wasmtime-v49.0.2-x86_64-linux.tar.xz
          tar -xJf /tmp/wasmtime.tar.xz -C /usr/local/bin --strip-components=1 wasmtime-v49.0.2-x86_64-linux/wasmtime
          wasmtime --version
          echo "WASI_SYSROOT=/opt/wasi-sysroot" >> "$GITHUB_ENV"
          for t in cc gcc clang ld; do
            if command -v "$t"; then exit 1; fi
          done

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: compiler-linux

      - name: Build the native compiler with itself, then the wasm compiler
        run: |
          set -eu
          chmod +x super-c
          mv super-c super-c-boot
          SC_LEAK_CHECK=fatal ./super-c-boot build
          ./super-c build --target=wasm --profile=release -o super-c.wasm

      - name: Run the test suite against the wasm compiler
        run: SC_NATIVE_LOG="$RUNNER_TEMP/native.log" SC_TEST_SUPERC="$GITHUB_WORKSPACE/ci/wasm-superc.sh" SC_LEAK_CHECK=fatal timeout 1500 ./super-c test --test-shard=${{ matrix.test_shard }}

      - name: The modules that went through C
        if: failure()
        run: cat "$RUNNER_TEMP/native.log" || true

  # The native backend against the C pipeline on each platform (ci/speed.sh): cold self-builds, the
  # speed of the compiler each pipeline produces, and the transpile count of each.
  speed:
    name: speed (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}
          cstd: ${{ matrix.target == 'windows' && '-std=gnu11 -D_POSIX_C_SOURCE=200809L -g1' || '' }}
          llvm-mingw: ${{ matrix.target == 'windows' }}

      - name: Exclude work dirs from Defender
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
          Add-MpPreference -ExclusionProcess "gcc.exe"
          Add-MpPreference -ExclusionProcess "ld.exe"
          Add-MpPreference -ExclusionProcess "clang.exe"
          Add-MpPreference -ExclusionProcess "super-c.exe"
          Add-MpPreference -ExclusionProcess "sc.exe"

      - uses: ./.github/actions/bootstrap
        id: boot
        with:
          target: ${{ matrix.target }}

      - name: Build the compiler
        run: |
          set -eu
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          "./super-c-boot${BINEXT:-}" build --bootstrap-tags ${cstd:+"$cstd"}
          bin="super-c${BINEXT:-}"
          [ -f "./$bin" ] || mv "./super-c" "./$bin"
          test -x "./$bin"

      - name: Compare the native backend with the C pipeline
        run: |
          set -eu
          case "$RUNNER_OS" in
            Linux) export CC_COUNTS=clang PROFDATA="llvm-profdata-$(clang -dumpversion | cut -d. -f1)" ;;
            macOS) export CC_COUNTS=cc PROFDATA="$(xcrun -f llvm-profdata)" ;;
            *) export CC_COUNTS="$LLVM_MINGW/x86_64-w64-mingw32-clang.exe" PROFDATA="$LLVM_MINGW/llvm-profdata.exe" ;;
          esac
          bash ci/speed.sh

      # The count the release checks: this commit's compiler against the last release's.
      - uses: ./.github/actions/transpile-counts
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}
          base-tag: ${{ steps.boot.outputs.tag }}
