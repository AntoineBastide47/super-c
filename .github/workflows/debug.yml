# The permanent probe lane, for one run: how the wasm C compiler treats a loop of a C library function.
name: Debug
on:
  workflow_dispatch
permissions:
  contents: read
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fill:
    name: memset idiom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          sha: ${{ github.sha }}

      - name: Compile a fill loop three ways
        run: |
          set -u
          cc="${WASI_SDK_PATH:+$WASI_SDK_PATH/bin/}clang --target=wasm32-wasip1"
          $cc --version | head -n 1
          cat > m.c <<'SRC'
          #include <stddef.h>
          #include <stdint.h>
          A void libc__fill(uint8_t *d, uint8_t c, size_t n) {
            size_t i = 0;
            while (i < n && (((size_t)d + i) & 7) != 0) { d[i] = c; i += 1; }
            uint64_t w = (uint64_t)c * 0x0101010101010101ull;
            while (i + 8 <= n) { *(uint64_t *)(d + i) = w; i += 8; }
            while (i < n) { d[i] = c; i += 1; }
          }
          A void *(memset)(void *dst, int32_t c, size_t n) {
            libc__fill((uint8_t *)dst, (uint8_t)c, n);
            return dst;
          }
          SRC
          for o in -O2 -O3; do
            $cc $o '-DA=__attribute__((no_builtin))' -S m.c -o a.s
            echo "attribute $o: calls of memset $(grep -c 'call.*memset' a.s), memory.fill $(grep -c 'memory.fill' a.s)"
            $cc $o -DA= -fno-builtin -S m.c -o b.s
            echo "flag $o: calls of memset $(grep -c 'call.*memset' b.s), memory.fill $(grep -c 'memory.fill' b.s)"
            $cc $o -DA= -S m.c -o c.s
            echo "neither $o: calls of memset $(grep -c 'call.*memset' c.s), memory.fill $(grep -c 'memory.fill' c.s)"
          done
          $cc -O3 '-DA=__attribute__((no_builtin))' -S -emit-llvm m.c -o a.ll
          grep -n -E 'attributes #|llvm.memset|define ' a.ll | cut -c1-200
