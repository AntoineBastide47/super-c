# The permanent probe lane: whatever currently needs proving on a real runner lives here as the job
# content, run on demand from the Actions tab. Edit the jobs for the next investigation; do not remove
# the file. Current probe: this tree's compiler on every platform with a native backend (macOS arm64,
# Linux x86-64, Linux arm64, Windows x86-64): the test suite, leak-gated, in the release's shards, and
# the self-compile benchmark, whose per-phase heap (MiB) must agree across the platforms.
# And wasm, as the release runs it: the compiler built for wasm32, its vector tests and self-host
# fixpoint under wasmtime, the suite with wasm32 programs, and the suite against the wasm compiler.
name: Debug
on:
  workflow_dispatch
permissions:
  contents: read
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    name: compile (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos }
          - { os: ubuntu-latest, target: linux }
          # No release ships a Linux arm64 compiler: the x86-64 runner cross-builds it against the arm64
          # C library. Both runners run Ubuntu 26.04: the arm64 runner's glibc.
          - { os: ubuntu-26.04, target: linux_arm64, platform: linux }
          - { os: windows-latest, target: windows }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: ${{ matrix.platform || matrix.target }}

      - name: Build the compiler
        run: |
          set -eu
          SC_LEAK_CHECK=fatal "./super-c-boot${BINEXT:-}" build --bootstrap-tags -fno-prove
          test -x "./super-c${BINEXT:-}"

      - name: Cross-build the arm64 compiler
        if: matrix.target == 'linux_arm64'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y libc6-dev-arm64-cross
          SC_LEAK_CHECK=fatal ./super-c build --target=linux --arch=aarch64 --sysroot=/usr/aarch64-linux-gnu --out-dir=build-a64 -o super-c-a64
          mv super-c-a64 super-c

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-${{ matrix.target }}
          path: super-c${{ env.BINEXT }}
          if-no-files-found: error
          retention-days: 1

  # The suite with the compiler `compile` built. Leak-gated: a process that leaks or double-frees exits
  # nonzero. The first shard of each target also checks the builds with LIR (SC_LIR).
  test:
    needs: compile
    name: test (${{ matrix.target }} ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos, shard: "1/2" }
          - { os: macos-latest, target: macos, shard: "2/2" }
          - { os: ubuntu-latest, target: linux, shard: "1/2" }
          - { os: ubuntu-latest, target: linux, shard: "2/2" }
          - { os: ubuntu-26.04-arm, target: linux_arm64, shard: "1/2" }
          - { os: ubuntu-26.04-arm, target: linux_arm64, shard: "2/2" }
          - { os: windows-latest, target: windows, shard: "1/3" }
          - { os: windows-latest, target: windows, shard: "2/3" }
          - { os: windows-latest, target: windows, shard: "3/3" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      - name: Run the test suite
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          chmod +x "./$bin"
          dur=tests/durations/${{ matrix.target }}.tsv; [ -f "$dur" ] || dur=tests/durations.tsv
          case "${{ matrix.shard }}" in 1/*) export SC_LIR=1 ;; esac
          SC_LEAK_CHECK=fatal "./$bin" test --quiet --test-shard=${{ matrix.shard }} --test-durations="$dur"

  # The whole cold native self-build, rounds at one job and at one job per core, timed and counted per
  # phase. The heap per phase (MiB) is a property of the sources and the target's code, so the platforms
  # agree on it within the targets' differences; time and cycles follow each runner's machine.
  bench:
    needs: compile
    name: self-compile bench (${{ matrix.target }} ${{ matrix.run }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos, run: 1 }
          - { os: ubuntu-latest, target: linux, run: 1 }
          - { os: ubuntu-latest, target: linux, run: 2 }
          - { os: ubuntu-latest, target: linux, run: 3 }
          - { os: ubuntu-26.04-arm, target: linux_arm64, run: 1 }
          - { os: windows-latest, target: windows, run: 1 }
          - { os: windows-latest, target: windows, run: 2 }
          - { os: windows-latest, target: windows, run: 3 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      - name: Self-compile benchmark
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          chmod +x "./$bin"
          { grep -m1 'model name' /proc/cpuinfo || sysctl -n machdep.cpu.brand_string || true; } 2>/dev/null
          echo "== after (1)"
          SC_NO_CACHE=1 SC_NO_TU_CACHE=1 "./$bin" bench --filter=self_compile
          if [ "${{ matrix.target }}" = linux ] || [ "${{ matrix.target }}" = windows ]; then
            mkdir -p prevw
            git fetch --depth 1 origin 93bd2d00840fd346dea614211f795621730a40d4
            git archive FETCH_HEAD | tar -x -C prevw
            (cd prevw && SC_STD_DIR="$PWD/std" "../$bin" build --bootstrap-tags -fno-prove -o "super-c-prev${BINEXT:-}")
            for k in 1 2; do
              echo "== before ($k)"
              SC_NO_CACHE=1 SC_NO_TU_CACHE=1 SC_STD_DIR="$PWD/std" "prevw/super-c-prev${BINEXT:-}" bench --filter=self_compile
              echo "== after ($((k + 1)))"
              SC_NO_CACHE=1 SC_NO_TU_CACHE=1 "./$bin" bench --filter=self_compile
            done
          fi

  # The compiler cross-built to wasm32-wasip1, with the native compiler that built it.
  wasm-compile:
    name: wasm compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: linux

      - name: Build the native compiler
        run: SC_LEAK_CHECK=fatal ./super-c-boot build --bootstrap-tags -fno-prove

      - name: Build the wasm compiler
        run: ./super-c build --target=wasm --profile=release -o super-c.wasm

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-wasm
          path: |
            super-c
            super-c.wasm
          if-no-files-found: error
          retention-days: 1

  # The vector tests on wasm32 with simd128, and the self-host fixpoint under wasmtime.
  wasm-checks:
    needs: wasm-compile
    name: wasm checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          role: checks
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-wasm

      - name: Make the native compiler executable
        run: chmod +x ./super-c

      - name: Vector tests on wasm32 with simd128
        run: |
          SC_SIMD_LANE=wasm SC_LEAK_CHECK=fatal ./super-c test --quiet --test-timeout=900 --filter=simd_
          SC_SIMD_LANE=wasm SC_LEAK_CHECK=fatal ./super-c test --quiet --test-timeout=900 --filter=gen_vector_seeds

      - name: Self-host fixpoint under wasmtime
        run: |
          set -eu
          w=/tmp/wwasm
          mkdir -p "$w"
          cp -R src std ffi build.toml "$w/" && rm -rf "$w/src/build"
          cp super-c.wasm "$w/gen1.wasm"
          cd "$w"
          gen() {
            "$GITHUB_WORKSPACE/super-c" build --target=wasm --profile=release \
              --transpiler="wasmtime run --dir=/ --env WASI_SDK_PATH=$WASI_SDK_PATH --argv0 $w/$1 -- $w/$1" -o "$2"
          }
          gen gen1.wasm gen2.wasm
          cp -R build/release/raw /tmp/wasm-gen1
          gen gen2.wasm gen3.wasm
          diff -r --exclude=.tu_cache --exclude=__sc_hfacts /tmp/wasm-gen1 build/release/raw

  # The native compiler runs the suite, and every program a test builds is a wasm32 module run under
  # wasmtime.
  wasm-target:
    needs: wasm-compile
    name: wasm target (${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        test_shard: ["1/2", "2/2"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-wasm

      - name: Run the test suite with wasm32 programs
        run: |
          chmod +x ./super-c
          SC_TEST_TARGET=wasm SC_LEAK_CHECK=fatal ./super-c test --quiet --test-timeout=900 --test-shard=${{ matrix.test_shard }}

  # The suite against the wasm compiler: every transpile-class invocation runs inside wasmtime.
  wasm-test:
    needs: wasm-compile
    name: wasm test (${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        test_shard: ["1/2", "2/2"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-wasm

      - name: Run the test suite against the wasm compiler
        run: |
          chmod +x ./super-c
          dur=tests/durations/wasm.tsv; [ -f "$dur" ] || dur=tests/durations.tsv
          SC_TEST_SUPERC="$GITHUB_WORKSPACE/ci/wasm-superc.sh" SC_LEAK_CHECK=fatal ./super-c test --quiet --test-shard=${{ matrix.test_shard }} --test-durations="$dur"

  # The SIMD kernels of bench/simd_baseline: the hand-written C kernels, and the scalar and portable
  # kernels built by the native backend and through the C tree with the C compiler at -O3 (clang where
  # the runner has it). Five interleaved runs of each; the benchmark's own checks do not stop a run.
  simd-timing:
    needs: compile
    if: ${{ always() }}
    name: simd timing (${{ matrix.target }} ${{ matrix.run }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux, run: 1 }
          - { os: ubuntu-latest, target: linux, run: 2 }
          - { os: ubuntu-latest, target: linux, run: 3 }
          - { os: ubuntu-latest, target: linux, run: 4 }
          - { os: ubuntu-latest, target: linux, run: 5 }
          - { os: ubuntu-26.04-arm, target: linux_arm64, run: 1 }
          - { os: windows-latest, target: windows, run: 1 }
          - { os: windows-latest, target: windows, run: 2 }
          - { os: windows-latest, target: windows, run: 3 }
          - { os: windows-latest, target: windows, run: 4 }
          - { os: windows-latest, target: windows, run: 5 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      - name: Time the kernels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          x=${BINEXT:-}
          chmod +x "./super-c$x"
          mkdir -p timing
          if [ "${{ matrix.target }}" != windows ] && command -v clang >/dev/null 2>&1; then export CC=clang; fi
          {
            grep -m1 'model name' /proc/cpuinfo || true
            uname -sm
            ${CC:-cc} --version | head -n 1
          } > timing/machine.txt 2>&1
          cat timing/machine.txt
          f=bench/simd_baseline/kernels.spc
          awk '/bench::fail\(/ { f = 1 } f && /^ *return;$/ { f = 0; next } { print }' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          sh bench/simd_baseline/kernels.sh
          "./super-c$x" bench --no-run --filter=simd_baseline
          cp "build/bench-bin$x" "build/bench-nat$x"
          "./super-c$x" build build/bench_root.spc --profile=bench --emit-c --out-dir=build/ctree
          raw=$(dirname "$(find build/ctree -name __units | head -n 1)")
          sh ci/cc_tree.sh "$raw" "build/bench-clang$x" -O3
          # The released compiler (v0.17.26: run-time copies that mix the legacy SSE encoding with ymm
          # registers) builds that release's bench from that release's tree, for a comparison on this
          # runner.
          if [ "${{ matrix.target }}" = linux ] || [ "${{ matrix.target }}" = windows ]; then
            mkdir -p old oldw
            if [ "${{ matrix.target }}" = linux ]; then
              gh release download v0.17.26 -R "${{ github.repository }}" -p super-c-linux-x86_64.tar.gz -D old
              tar xzf old/super-c-linux-x86_64.tar.gz -C old
              od=$PWD/old/super-c-linux-x86_64
            else
              gh release download v0.17.26 -R "${{ github.repository }}" -p super-c-windows-x86_64.zip -D old
              unzip -q old/super-c-windows-x86_64.zip -d old
              od=$PWD/old/super-c-windows-x86_64
            fi
            git fetch --depth 1 origin refs/tags/v0.17.26:refs/tags/v0.17.26
            git archive v0.17.26 | tar -x -C oldw
            # The released compiler loads the std and ffi packed beside it: the tree's own would be a
            # second copy of the same modules.
            rm -rf oldw/std oldw/ffi
            if (cd oldw && awk '/bench::fail\(/ { f = 1 } f && /^ *return;$/ { f = 0; next } { print }' "$f" > "$f.tmp" && mv "$f.tmp" "$f" && sh bench/simd_baseline/kernels.sh && "$od/super-c$x" bench --no-run --filter=simd_baseline); then
              cp "oldw/build/bench-bin$x" "build/bench-old$x"
            fi
          fi
          # The compiler of the last commit's sources (commit 93bd2d00 of this branch holds them), built by
          # this tree's compiler, builds that tree's bench: the same kernels before this tree's changes,
          # on this runner.
          if [ "${{ matrix.target }}" = linux ] || [ "${{ matrix.target }}" = windows ]; then
            mkdir -p prevw
            if git fetch --depth 1 origin 93bd2d00840fd346dea614211f795621730a40d4 && git archive FETCH_HEAD | tar -x -C prevw; then
              if (cd prevw && SC_STD_DIR="$PWD/std" "../super-c$x" build --bootstrap-tags -fno-prove -o "super-c-prev$x" && awk '/bench::fail\(/ { f = 1 } f && /^ *return;$/ { f = 0; next } { print }' "$f" > "$f.tmp" && mv "$f.tmp" "$f" && sh bench/simd_baseline/kernels.sh && "./super-c-prev$x" bench --no-run --filter=simd_baseline); then
                cp "prevw/build/bench-bin$x" "build/bench-prev$x"
              fi
            fi
          fi
          for k in 1 2 3 4 5; do
            if [ -x "build/bench-prev$x" ]; then
              "build/bench-prev$x" > "timing/prev-r$k.txt" 2>&1 || true
              SC_SIMD_LEVEL=0 "build/bench-prev$x" > "timing/prevbase-r$k.txt" 2>&1 || true
            fi
            "build/bench-nat$x" > "timing/nat-r$k.txt" 2>&1 || true
            "build/bench-clang$x" > "timing/clang-r$k.txt" 2>&1 || true
            if [ "${{ matrix.target }}" != linux_arm64 ]; then
              SC_SIMD_LEVEL=0 "build/bench-nat$x" > "timing/base-r$k.txt" 2>&1 || true
            fi
            if [ -x "build/bench-old$x" ]; then
              "build/bench-old$x" > "timing/old-r$k.txt" 2>&1 || true
            fi
          done
          grep -c '^simd' timing/*.txt

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: simd-timing-${{ matrix.target }}-${{ matrix.run }}
          path: timing/*.txt
          if-no-files-found: error
          retention-days: 3

  simd-timing-wasm:
    needs: wasm-compile
    name: simd timing (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-wasm

      - name: The C library's C tree runs when the wasi-sdk's clang optimizes it
        run: |
          set -u
          chmod +x ./super-c
          "$WASI_SDK_PATH/bin/clang" --version | head -n 1
          SC_TEST_CC="$WASI_SDK_PATH/bin/clang" SC_LEAK_CHECK=fatal ./super-c test --filter=wasm_libc_c_tree_runs_optimized

      - name: Time the kernels under wasmtime
        run: |
          set -u
          chmod +x ./super-c
          mkdir -p timing
          {
            grep -m1 'model name' /proc/cpuinfo || true
            wasmtime --version
            "${WASI_SDK_PATH:+$WASI_SDK_PATH/bin/}clang" --version | head -n 1
          } > timing/machine.txt 2>&1
          cat timing/machine.txt
          f=bench/simd_baseline/kernels.spc
          awk '/bench::fail\(/ { f = 1 } f && /^ *return;$/ { f = 0; next } { print }' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          sh bench/simd_baseline/kernels.sh --target=wasm
          ./super-c bench --no-run --filter=simd_baseline --target=wasm
          cp build/bench-bin build/bench-nat.wasm
          ./super-c build build/bench_root.spc --profile=bench --emit-c --target=wasm --out-dir=build/ctree
          raw=$(dirname "$(find build/ctree -name __units | head -n 1)")
          # The tree's C library units (`__units_nobuiltin`) compile with `-fno-builtin` (`ci/cc_tree.sh`).
          CC="${WASI_SDK_PATH:+$WASI_SDK_PATH/bin/}clang --target=wasm32-wasip1" sh ci/cc_tree.sh "$raw" build/bench-clang.wasm -O3
          for k in 1 2 3 4 5; do
            wasmtime build/bench-nat.wasm > "timing/nat-r$k.txt" 2>&1 || true
            wasmtime build/bench-clang.wasm > "timing/clang-r$k.txt" 2>&1 || true
          done
          grep -c '^simd' timing/*.txt

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: simd-timing-wasm
          path: timing/*.txt
          if-no-files-found: error
          retention-days: 3
