# The permanent probe lane: whatever currently needs proving on a real runner lives here as the job
# content, run on demand from the Actions tab. Edit the job for the next investigation; do not remove
# the file. Current probe: the code generation gap benchmarks (bench/gaps, GAPS.md), each probe as
# Super-C compiles it against the same probe compiled by clang -O2, on Linux x86-64, Linux arm64 and
# Windows x86-64; then the same benchmarks built by the latest release's compiler (the "before").
# No test suite runs.
name: Debug
on:
  workflow_dispatch
permissions:
  contents: read
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gaps:
    name: gaps (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}
          llvm-mingw: ${{ matrix.target == 'windows' }}

      - uses: ./.github/actions/bootstrap
        with:
          target: ${{ matrix.target }}

      - name: Build the compiler
        run: |
          set -eu
          "./super-c-boot${BINEXT:-}" build --bootstrap-tags
          [ -f "./super-c${BINEXT:-}" ] || mv ./super-c "./super-c${BINEXT:-}"

      # clang -O2 for the C side: the runner's on Linux, llvm-mingw's on Windows (the mingw ABI).
      - name: Build the clang probes
        run: |
          set -eu
          if [ "${{ matrix.target }}" = windows ]; then
            export CC="$LLVM_MINGW/clang" AR="$LLVM_MINGW/llvm-ar"
          else
            export CC=clang
          fi
          $CC --version | head -1
          sh bench/gaps/lib.sh

      - name: Gap benchmarks (this tree's compiler)
        run: |
          "./super-c${BINEXT:-}" bench --filter=gaps_

      - name: Gap benchmarks (the latest release's compiler)
        continue-on-error: true
        run: |
          rm -rf build/bench
          "./super-c-boot${BINEXT:-}" bench --filter=gaps_

  # Linux arm64: no release ships a Linux arm64 compiler, so the x86-64 runner cross-builds this tree's
  # compiler against the arm64 C library, and the arm64 runner benchmarks with it.
  arm64-compile:
    name: linux arm64 compile
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: linux
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: linux

      - name: Cross-build an arm64 compiler
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y libc6-dev-arm64-cross
          ./super-c-boot build --bootstrap-tags
          ./super-c build --target=linux --arch=aarch64 --sysroot=/usr/aarch64-linux-gnu --out-dir=build-a64 -o super-c-a64

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-linux-arm64
          path: super-c-a64
          if-no-files-found: error
          retention-days: 1

  gaps-arm64:
    needs: arm64-compile
    name: gaps (linux arm64)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: compiler-linux-arm64

      - name: Build the clang probes
        run: |
          set -eu
          command -v clang || { sudo apt-get update; sudo apt-get install -y clang; }
          clang --version | head -1
          CC=clang sh bench/gaps/lib.sh

      - name: Gap benchmarks (this tree's compiler)
        run: |
          set -eu
          chmod +x super-c-a64
          mv super-c-a64 super-c
          ./super-c bench --filter=gaps_
