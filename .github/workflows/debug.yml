# The permanent probe lane: whatever currently needs proving on a real runner lives here as the job
# content, run on demand from the Actions tab. Edit the jobs for the next investigation; do not remove
# the file. Current probe: this tree's compiler on every platform with a native backend (macOS arm64,
# Linux x86-64, Linux arm64, Windows x86-64): the test suite, leak-gated, in the release's shards, and
# the self-compile benchmark, whose per-phase heap (MiB) must agree across the platforms.
name: Debug
on:
  workflow_dispatch
permissions:
  contents: read
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    name: compile (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos }
          - { os: ubuntu-latest, target: linux }
          # No release ships a Linux arm64 compiler: the x86-64 runner cross-builds it against the arm64
          # C library. Both runners run Ubuntu 26.04: the arm64 runner's glibc.
          - { os: ubuntu-26.04, target: linux_arm64, platform: linux }
          - { os: windows-latest, target: windows }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: ${{ matrix.platform || matrix.target }}

      - name: Build the compiler
        run: |
          set -eu
          SC_LEAK_CHECK=fatal "./super-c-boot${BINEXT:-}" build --bootstrap-tags
          test -x "./super-c${BINEXT:-}"

      - name: Cross-build the arm64 compiler
        if: matrix.target == 'linux_arm64'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y libc6-dev-arm64-cross
          SC_LEAK_CHECK=fatal ./super-c build --target=linux --arch=aarch64 --sysroot=/usr/aarch64-linux-gnu --out-dir=build-a64 -o super-c-a64
          mv super-c-a64 super-c

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-${{ matrix.target }}
          path: super-c${{ env.BINEXT }}
          if-no-files-found: error
          retention-days: 1

  # The suite with the compiler `compile` built. Leak-gated: a process that leaks or double-frees exits
  # nonzero. The first shard of each target also checks the builds with LIR (SC_LIR).
  test:
    needs: compile
    name: test (${{ matrix.target }} ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos, shard: "1/2" }
          - { os: macos-latest, target: macos, shard: "2/2" }
          - { os: ubuntu-latest, target: linux, shard: "1/2" }
          - { os: ubuntu-latest, target: linux, shard: "2/2" }
          - { os: ubuntu-26.04-arm, target: linux_arm64, shard: "1/2" }
          - { os: ubuntu-26.04-arm, target: linux_arm64, shard: "2/2" }
          - { os: windows-latest, target: windows, shard: "1/3" }
          - { os: windows-latest, target: windows, shard: "2/3" }
          - { os: windows-latest, target: windows, shard: "3/3" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      - name: Run the test suite
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          chmod +x "./$bin"
          dur=tests/durations/${{ matrix.target }}.tsv; [ -f "$dur" ] || dur=tests/durations.tsv
          case "${{ matrix.shard }}" in 1/*) export SC_LIR=1 ;; esac
          SC_LEAK_CHECK=fatal "./$bin" test --quiet --test-shard=${{ matrix.shard }} --test-durations="$dur"

  # The whole cold native self-build, rounds at one job and at one job per core, timed and counted per
  # phase. The heap per phase (MiB) is a property of the sources and the target's code, so the platforms
  # agree on it within the targets' differences; time and cycles follow each runner's machine.
  bench:
    needs: compile
    name: self-compile bench (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos }
          - { os: ubuntu-latest, target: linux }
          - { os: ubuntu-26.04-arm, target: linux_arm64 }
          - { os: windows-latest, target: windows }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      - name: Self-compile benchmark
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          chmod +x "./$bin"
          { grep -m1 'model name' /proc/cpuinfo || sysctl -n machdep.cpu.brand_string || true; } 2>/dev/null
          "./$bin" bench --filter=self_compile
