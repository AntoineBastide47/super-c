# The permanent probe lane: whatever currently needs proving on a real runner lives here as the job
# content, run on demand from the Actions tab. Edit the jobs for the next investigation; do not remove
# the file. Current probe: this tree's compiler on every platform with a native backend (macOS arm64,
# Linux x86-64, Linux arm64, Windows x86-64): the test suite, leak-gated, in the release's shards, and
# the self-compile benchmark, whose per-phase heap (MiB) must agree across the platforms. Then what
# the comparison and layout work costs and gains on each runner's processor: the cost of running a short
# function or loop across an address boundary (`boundary`), the code generation suite against the C
# kernels (`codegen`), and this tree's compiler against its parent commit's, second generation each: code
# size and the time of one native build (`text`).
name: Debug
on:
  workflow_dispatch
permissions:
  contents: read
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # What a short function, or the short loop that calls it, costs when a boundary of 64 to 65536 bytes
  # falls inside it, on this runner's processor (ci/boundary_cost.c places the machine code itself).
  boundary:
    name: boundary cost (${{ matrix.os }} ${{ matrix.n }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos, n: 1 }
          # An Intel processor.
          - { os: macos-15-intel, target: macos, n: 2 }
          - { os: ubuntu-26.04-arm, target: linux_arm64, n: 1 }
          - { os: ubuntu-24.04-arm, target: linux_arm64, n: 2 }
          - { os: ubuntu-latest, target: linux, n: 1 }
          - { os: ubuntu-latest, target: linux, n: 2 }
          - { os: ubuntu-latest, target: linux, n: 3 }
          - { os: ubuntu-latest, target: linux, n: 4 }
          - { os: ubuntu-latest, target: linux, n: 5 }
          - { os: ubuntu-latest, target: linux, n: 6 }
          - { os: ubuntu-22.04, target: linux, n: 7 }
          - { os: ubuntu-22.04, target: linux, n: 8 }
          - { os: ubuntu-24.04, target: linux, n: 9 }
          - { os: ubuntu-24.04, target: linux, n: 10 }
          - { os: windows-latest, target: windows, n: 1 }
          - { os: windows-latest, target: windows, n: 2 }
          - { os: windows-latest, target: windows, n: 3 }
          - { os: windows-latest, target: windows, n: 4 }
          - { os: windows-2022, target: windows, n: 5 }
          - { os: windows-2022, target: windows, n: 6 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - name: Measure
        run: |
          set -euo pipefail
          {
            { grep -m1 'model name' /proc/cpuinfo || sysctl -n machdep.cpu.brand_string || lscpu || echo "${PROCESSOR_IDENTIFIER:-unknown processor}"; } 2>/dev/null
            "${CC:-cc}" -O2 ci/boundary_cost.c -o "bcost${BINEXT:-}"
            for r in 1 2 3; do "./bcost${BINEXT:-}"; done
          } | tee boundary-${{ matrix.os }}-${{ matrix.n }}.txt

      - uses: actions/upload-artifact@v7
        with:
          name: boundary-${{ matrix.os }}-${{ matrix.n }}
          path: boundary-${{ matrix.os }}-${{ matrix.n }}.txt
          if-no-files-found: error
          retention-days: 3
