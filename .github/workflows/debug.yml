# The permanent probe lane: whatever currently needs proving on a real runner lives here as the job
# content, run on demand from the Actions tab. Edit the job for the next investigation; do not remove
# the file. Current probe: the code generation benchmarks (bench/codegen), each kernel as Super-C
# compiles it against the same kernel compiled by clang -O2, on Linux x86-64 (3 runners), Linux arm64
# and Windows x86-64 (2 runners); then the same benchmarks built by the latest release's compiler (the "before").
# The test suite runs on Windows x86-64 alone (3 shards), where the code generator's Microsoft x64 paths run.
name: Debug
on:
  workflow_dispatch
permissions:
  contents: read
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Each target on several runners at once: the machines differ, so a ratio holds when it holds on each.
  codegen:
    name: codegen (${{ matrix.target }} ${{ matrix.run }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux, run: 1 }
          - { os: ubuntu-latest, target: linux, run: 2 }
          - { os: ubuntu-latest, target: linux, run: 3 }
          - { os: windows-latest, target: windows, run: 1 }
          - { os: windows-latest, target: windows, run: 2 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}
          llvm-mingw: ${{ matrix.target == 'windows' }}

      - uses: ./.github/actions/bootstrap
        with:
          target: ${{ matrix.target }}

      - name: Build the compiler
        run: |
          set -eu
          "./super-c-boot${BINEXT:-}" build --bootstrap-tags
          [ -f "./super-c${BINEXT:-}" ] || mv ./super-c "./super-c${BINEXT:-}"

      # clang -O2 for the C side: the runner's on Linux, llvm-mingw's on Windows (the mingw ABI).
      - name: Build the clang kernels
        run: |
          set -eu
          if [ "${{ matrix.target }}" = windows ]; then
            export CC="$LLVM_MINGW/clang" AR="$LLVM_MINGW/llvm-ar"
          else
            export CC=clang
          fi
          $CC --version | head -1
          sh bench/codegen/lib.sh

      - name: Code generation benchmarks (this tree's compiler)
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          "./super-c${BINEXT:-}" bench --filter=codegen_

      - name: Code generation benchmarks (the latest release's compiler)
        continue-on-error: true
        run: |
          rm -rf build/bench
          "./super-c-boot${BINEXT:-}" bench --filter=codegen_

  # The test suite on Windows x86-64, with this tree's compiler, in 3 shards; the first shard once more
  # after the build caches the release compiler filled are cleared (`clean`). A failure lists the objects
  # that reference a Microsoft x64 entry thunk (`.msabi`) no object defines.
  test-windows:
    name: test (windows ${{ matrix.shard }}${{ matrix.clean && ' clean' || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: "1/3", clean: false }
          - { shard: "2/3", clean: false }
          - { shard: "3/3", clean: false }
          - { shard: "1/3", clean: true }
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: windows
          sha: ${{ github.sha }}
          llvm-mingw: true

      - uses: ./.github/actions/bootstrap
        with:
          target: windows

      - name: Build the compiler
        run: |
          set -eu
          "./super-c-boot${BINEXT:-}" build --bootstrap-tags
          [ -f "./super-c${BINEXT:-}" ] || mv ./super-c "./super-c${BINEXT:-}"

      - name: Clear the build caches
        if: matrix.clean
        run: |
          rm -rf build "$HOME/.super-c/cache"

      - name: Run the test suite
        run: |
          set -eu
          SC_LEAK_CHECK=fatal "./super-c${BINEXT:-}" test --quiet --test-shard=${{ matrix.shard }}

      - name: The undefined entry thunks
        if: failure()
        run: |
          ls "$HOME/.super-c/cache" | head -5 || true
          find build "$HOME/.super-c/cache" -name '*.o' > objs.txt 2>/dev/null || true
          wc -l objs.txt
          while read -r f; do
            "$LLVM_MINGW/llvm-nm" "$f" 2>/dev/null | grep '\.msabi' | sed "s|^|$f: |"
          done < objs.txt > thunks.txt
          grep ' U ' thunks.txt | head -30
          for s in $(grep ' U ' thunks.txt | awk '{print $NF}' | sort -u | head -5); do
            echo "== $s"
            grep -F "$s" thunks.txt | head -6
          done

  # Linux arm64: no release ships a Linux arm64 compiler, so the x86-64 runner cross-builds this tree's
  # compiler against the arm64 C library, and the arm64 runner benchmarks with it.
  arm64-compile:
    name: linux arm64 compile
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: linux
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: linux

      - name: Cross-build an arm64 compiler
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y libc6-dev-arm64-cross
          ./super-c-boot build --bootstrap-tags
          ./super-c build --target=linux --arch=aarch64 --sysroot=/usr/aarch64-linux-gnu --out-dir=build-a64 -o super-c-a64

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-linux-arm64
          path: super-c-a64
          if-no-files-found: error
          retention-days: 1

  codegen-arm64:
    needs: arm64-compile
    name: codegen (linux arm64)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: compiler-linux-arm64

      - name: Build the clang kernels
        run: |
          set -eu
          command -v clang || { sudo apt-get update; sudo apt-get install -y clang; }
          clang --version | head -1
          CC=clang sh bench/codegen/lib.sh

      - name: Code generation benchmarks (this tree's compiler)
        run: |
          set -eu
          chmod +x super-c-a64
          mv super-c-a64 super-c
          ./super-c bench --filter=codegen_
