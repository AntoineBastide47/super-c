# The permanent probe lane, for one investigation: on Windows x86-64 at the baseline level, the portable
# abs_diff_u8 kernel against the hand-written SSE2 one at 4096 bytes. Each job builds six variants of the
# bench and runs them in turn on one runner; five jobs give several runner processors.
name: Debug
on:
  workflow_dispatch
permissions:
  contents: read
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    name: compile (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: windows
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: windows

      - name: Build the compiler
        run: |
          set -eu
          SC_LEAK_CHECK=fatal "./super-c-boot${BINEXT:-}" build --bootstrap-tags -fno-prove
          test -x "./super-c${BINEXT:-}"

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-windows
          path: super-c${{ env.BINEXT }}
          if-no-files-found: error
          retention-days: 1

  variants:
    needs: compile
    name: abs_diff_u8 variants (${{ matrix.run }})
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: windows
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-windows

      - name: Build and time the variants
        run: |
          set -u
          x=${BINEXT:-}
          chmod +x "./super-c$x"
          mkdir -p timing
          { grep -m1 'model name' /proc/cpuinfo || true; uname -sm; } > timing/machine.txt 2>&1
          cat timing/machine.txt
          f=bench/simd_baseline/kernels.spc
          awk '/bench::fail\(/ { f = 1 } f && /^ *return;$/ { f = 0; next } { print }' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          cp "$f" kernels.orig
          cat > variant.sh <<'EOF'
          set -eu
          v=$1
          f=$2
          notail() {
              awk '
          /^const fn abs_diff_u8_v\(/ { infn = 1 }
          infn && /^    while i < n \{$/ {
              print "    if i < n {"
              print "        abs_tail(ap, bp, outp, i, n);"
              print "    }"
              skip = 1
              next
          }
          skip { if ($0 ~ /^    }$/) { skip = 0; infn = 0 } next }
          { print }
          END {
              print ""
              print "@noinline"
              print "const fn abs_tail(ap: *const u8, bp: *const u8, outp: *mut u8, from: usize, n: usize) {"
              print "    let a = view(ap, n);"
              print "    let b = view(bp, n);"
              print "    let out = view_mut(outp, n);"
              print "    let mut i = from;"
              print "    while i < n {"
              print "        out[i] = if a[i] > b[i] {"
              print "            a[i] - b[i]"
              print "        } else {"
              print "            b[i] - a[i]"
              print "        };"
              print "        i += 1;"
              print "    }"
              print "}"
          }' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          }
          w32() {
              awk '
          /^const fn abs_diff_u8_v\(/ { infn = 1 }
          infn { gsub(/n % 64/, "n % 32"); gsub(/<u8, 64>/, "<u8, 32>"); gsub(/i \+= 64/, "i += 32") }
          infn && /^}$/ { infn = 0 }
          { print }' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          }
          case $v in
          base) ;;
          sizes-a) sed -i.bak 's/\[4096, 65536, 4194304\]/[1024, 16384, 4194304]/' "$f" && rm -f "$f.bak" ;;
          sizes-b) sed -i.bak 's/\[4096, 65536, 4194304\]/[2048, 8192, 4194304]/' "$f" && rm -f "$f.bak" ;;
          notail) notail ;;
          w32) w32 ;;
          w32nt) w32 && notail ;;
          *) echo "variant.sh: no variant $v" >&2; exit 1 ;;
          esac
          EOF
          sh bench/simd_baseline/kernels.sh
          vs="base sizes-a sizes-b notail w32 w32nt"
          for v in $vs; do
            cp kernels.orig "$f"
            bash variant.sh "$v" "$f"
            "./super-c$x" bench --no-run --filter=simd_baseline || { echo "::error::variant $v does not build"; exit 1; }
            cp "build/bench-bin$x" "build/bench-$v$x"
          done
          for k in 1 2 3 4 5 6 7; do
            for v in $vs; do
              SC_SIMD_LEVEL=0 "build/bench-$v$x" > "timing/$v-r$k.txt" 2>&1 || true
            done
          done
          grep -c '^simd' timing/*-r1.txt
          # Per variant and size: the medians of the seven runs (ns per element), the portable kernel over
          # the hand-written one, and their difference per call (ns).
          for v in $vs; do
            cat timing/$v-r*.txt | awk -F'\t' -v V="$v" '
          $1 == "simd" && $2 == "abs_diff_u8" { k = $3 SUBSEP $4; n[k]++; x[k, n[k]] = $5 + 0; sz[$4] = 1 }
          function med(k,   i, j, t, a, c) { c = n[k]; if (c == 0) return 0; for (i = 1; i <= c; i++) a[i] = x[k, i]; for (i = 1; i <= c; i++) for (j = i + 1; j <= c; j++) if (a[j] < a[i]) { t = a[i]; a[i] = a[j]; a[j] = t } return a[int((c + 1) / 2)] }
          END { for (s in sz) { p = med("portable" SUBSEP s); h = med("sse2" SUBSEP s); c = med("scalar" SUBSEP s); printf "probe\t%s\t%d\tscalar %.4f\tportable %.4f\tsse2 %.4f\tp/sse2 %.3f\tper call %+.1f ns\n", V, s, c, p, h, (h > 0 ? p / h : 0), (p - h) * s } }' | sort -t"$(printf '\t')" -k3 -n
          done

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: abs-diff-variants-${{ matrix.run }}
          path: timing/*.txt
          if-no-files-found: error
          retention-days: 3
