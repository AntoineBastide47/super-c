# The permanent probe lane, for one investigation: on Windows x86-64 at the baseline level, the portable
# abs_diff_u8 kernel against the hand-written SSE2 one at 4096 bytes. Each job builds variants of the
# bench and runs them in turn on one runner; five jobs give several runner processors.
name: Debug
on:
  workflow_dispatch
permissions:
  contents: read
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    name: compile (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: windows
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: windows

      - name: Build the compiler
        run: |
          set -eu
          SC_LEAK_CHECK=fatal "./super-c-boot${BINEXT:-}" build --bootstrap-tags -fno-prove
          test -x "./super-c${BINEXT:-}"

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-windows
          path: super-c${{ env.BINEXT }}
          if-no-files-found: error
          retention-days: 1

  variants:
    needs: compile
    name: abs_diff_u8 variants (${{ matrix.run }})
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: windows
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-windows

      - name: Build and time the variants
        run: |
          set -u
          x=${BINEXT:-}
          chmod +x "./super-c$x"
          mkdir -p timing
          { grep -m1 'model name' /proc/cpuinfo || true; uname -sm; } > timing/machine.txt 2>&1
          cat timing/machine.txt
          f=bench/simd_baseline/kernels.spc
          awk '/bench::fail\(/ { f = 1 } f && /^ *return;$/ { f = 0; next } { print }' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          cp "$f" kernels.orig
          cat > variant.sh <<'EOF'
          set -eu
          v=$1
          f=$2
          # Every variant prints, per size, the offsets in their pages of the two inputs and of the output.
          awk '
          { print }
          /^        let mut input = Input::new\(bytes, 0\);$/ {
              print "        println(\"addr\\t{}\\t{}\\t{}\\t{}\", bytes, (input.bytes_p.as_ptr() as usize) % 4096, (input.bytes_q.as_ptr() as usize) % 4096, (input.out_u8.as_ptr() as usize) % 4096);"
          }' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          notail() {
              awk '
          /^const fn abs_diff_u8_v\(/ { infn = 1 }
          infn && /^    while i < n \{$/ {
              print "    if i < n {"
              print "        abs_tail(ap, bp, outp, i, n);"
              print "    }"
              skip = 1
              next
          }
          skip { if ($0 ~ /^    }$/) { skip = 0; infn = 0 } next }
          { print }
          END {
              print ""
              print "@noinline"
              print "const fn abs_tail(ap: *const u8, bp: *const u8, outp: *mut u8, from: usize, n: usize) {"
              print "    let a = view(ap, n);"
              print "    let b = view(bp, n);"
              print "    let out = view_mut(outp, n);"
              print "    let mut i = from;"
              print "    while i < n {"
              print "        out[i] = if a[i] > b[i] {"
              print "            a[i] - b[i]"
              print "        } else {"
              print "            b[i] - a[i]"
              print "        };"
              print "        i += 1;"
              print "    }"
              print "}"
          }' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          }
          # grow <n>: n more opaque calls in the function placed before the kernel, which move the kernel's code.
          grow() {
              awk -v N="$1" '
          { print }
          /^        v\.reset\(\);$/ { for (k = 1; k <= N; k++) print "        bench::black_box(" k "u64);" }' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          }
          # The output starts half a page past the first input, modulo a page: no load of an input shares its low
          # 12 address bits with a store of the same or the previous iteration.
          apart() {
              awk '
          /^        for _ in 0\.\.self\.bytes_p\.len\(\) \+ GUARD \{$/ { print "        for _ in 0..self.bytes_p.len() + GUARD + 4096 {"; next }
          /^        let out_u8 = self\.out_u8\.as_mut_ptr\(\);$/ {
              print "        let out_u8 = unsafe (self.out_u8.as_mut_ptr() + ((self.bytes_p.as_ptr() as usize) + 8192 + 2048 - (self.out_u8.as_ptr() as usize)) % 4096);"
              next
          }
          { print }' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          }
          case $v in
          base) ;;
          grow2) grow 2 ;;
          grow5) grow 5 ;;
          notail) notail ;;
          apart) apart ;;
          apartnt) apart && notail ;;
          *) echo "variant.sh: no variant $v" >&2; exit 1 ;;
          esac
          EOF
          sh bench/simd_baseline/kernels.sh
          vs="base grow2 grow5 notail apart apartnt"
          od=$(command -v llvm-objdump || true)
          [ -n "$od" ] || od=$(ls "/c/Program Files/LLVM/bin/llvm-objdump.exe" 2>/dev/null || true)
          echo "objdump: ${od:-none}"
          for v in $vs; do
            cp kernels.orig "$f"
            bash variant.sh "$v" "$f"
            "./super-c$x" bench --no-run --filter=simd_baseline || { echo "::error::variant $v does not build"; exit 1; }
            cp "build/bench-bin$x" "build/bench-$v$x"
            # Where the kernel's code lies: its symbols, and the backward conditional jumps in it (a loop's
            # last instruction and its first).
            if [ -n "$od" ]; then
              "$od" --syms "build/bench-$v$x" 2>/dev/null | grep -i 'abs_diff_u8' | head -n 8 | sed "s/^/code\t$v\tsym\t/" > "timing/$v-code.txt" || true
              "$od" -d --no-show-raw-insn "build/bench-$v$x" 2>/dev/null | awk -v V="$v" '
          /abs_diff_u8_v[^>]*>:$/ { print "code\t" V "\tfn\t" $0; on = 1; next }
          />:$/ { on = 0 }
          on && /\tj[a-z]+\t/ { print "code\t" V "\tjump\t" $1 "\t" $2 "\t" $3 }' | head -n 60 >> "timing/$v-code.txt" || true
              cat "timing/$v-code.txt"
            fi
          done
          for k in 1 2 3 4 5 6 7; do
            for v in $vs; do
              SC_SIMD_LEVEL=0 "build/bench-$v$x" > "timing/$v-r$k.txt" 2>&1 || true
            done
          done
          grep -c '^simd' timing/*-r1.txt
          grep -h '^addr' timing/*-r1.txt | sort | uniq -c
          # Per variant and size: the medians of the seven runs (ns per element), the portable kernel over
          # the hand-written one, and their difference per call (ns).
          for v in $vs; do
            cat timing/$v-r*.txt | awk -F'\t' -v V="$v" '
          $1 == "simd" && $2 == "abs_diff_u8" { k = $3 SUBSEP $4; n[k]++; x[k, n[k]] = $5 + 0; sz[$4] = 1 }
          function med(k,   i, j, t, a, c) { c = n[k]; if (c == 0) return 0; for (i = 1; i <= c; i++) a[i] = x[k, i]; for (i = 1; i <= c; i++) for (j = i + 1; j <= c; j++) if (a[j] < a[i]) { t = a[i]; a[i] = a[j]; a[j] = t } return a[int((c + 1) / 2)] }
          END { for (s in sz) { p = med("portable" SUBSEP s); h = med("sse2" SUBSEP s); c = med("scalar" SUBSEP s); printf "probe\t%s\t%d\tscalar %.4f\tportable %.4f\tsse2 %.4f\tp/sse2 %.3f\tper call %+.1f ns\n", V, s, c, p, h, (h > 0 ? p / h : 0), (p - h) * s } }' | sort -t"$(printf '\t')" -k3 -n
          done

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: abs-diff-variants-${{ matrix.run }}
          path: timing/*.txt
          if-no-files-found: error
          retention-days: 3
