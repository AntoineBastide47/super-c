# The permanent probe lane: whatever currently needs proving on a real runner lives here as the job
# content, run on demand from the Actions tab. Edit the jobs for the next investigation; do not remove
# the file. Current probe: why one cold build of the compiler peaks higher on Linux arm64 than on x86-64:
# each Linux runner's kernel, C library and transparent huge page setting, and the build's peak resident
# set with transparent huge pages on and off (prctl PR_SET_THP_DISABLE, which the exec keeps).
name: Debug
on:
  workflow_dispatch
permissions:
  contents: read
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    name: compile (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux }
          # No release ships a Linux arm64 compiler: the x86-64 runner cross-builds it against the arm64
          # C library. Both runners run Ubuntu 26.04: the arm64 runner's glibc.
          - { os: ubuntu-26.04, target: linux_arm64, platform: linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: ${{ matrix.platform || matrix.target }}

      - name: Build the compiler
        run: |
          set -eu
          SC_LEAK_CHECK=fatal "./super-c-boot${BINEXT:-}" build --bootstrap-tags
          test -x "./super-c${BINEXT:-}"

      - name: Cross-build the arm64 compiler
        if: matrix.target == 'linux_arm64'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y libc6-dev-arm64-cross
          SC_LEAK_CHECK=fatal ./super-c build --target=linux --arch=aarch64 --sysroot=/usr/aarch64-linux-gnu --out-dir=build-a64 -o super-c-a64
          mv super-c-a64 super-c

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-${{ matrix.target }}
          path: super-c${{ env.BINEXT }}
          if-no-files-found: error
          retention-days: 1

  peak:
    needs: compile
    name: peak (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux }
          - { os: ubuntu-26.04, target: linux }
          - { os: ubuntu-26.04-arm, target: linux_arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      - name: Peak with transparent huge pages on and off
        run: |
          set -eu
          chmod +x ./super-c
          grep PRETTY_NAME /etc/os-release
          uname -r
          ldd --version | head -1
          echo "thp enabled: $(cat /sys/kernel/mm/transparent_hugepage/enabled)"
          echo "thp defrag: $(cat /sys/kernel/mm/transparent_hugepage/defrag)"
          printf '%s\n' 'import ctypes, os, sys' 'assert ctypes.CDLL(None).prctl(41, 1, 0, 0, 0) == 0' 'os.execv(sys.argv[1], sys.argv[1:])' > nothp.py
          export SC_NO_CACHE=1 SC_NO_EMIT_CACHE=1 SC_NO_TU_CACHE=1
          for round in 1 2; do
            SC_BUILD_STATS=on.json ./super-c build --profile=release --jobs=1 --out-dir=on -o on/sc
            SC_BUILD_STATS=off.json python3 nothp.py ./super-c build --profile=release --jobs=1 --out-dir=off -o off/sc
            echo "round $round, thp on:  $(grep -o '"at":"[a-z]*","rss_mib":[0-9.]*' on.json | tr '\n' ' ')"
            echo "round $round, thp off: $(grep -o '"at":"[a-z]*","rss_mib":[0-9.]*' off.json | tr '\n' ' ')"
            rm -rf on off on.json off.json
          done
