# Temporary probe for the windows-only dyn_fn_box_roundtrip compiler abort: rebuilds gen1 exactly the
# way the Release windows leg does and runs just that test, so each push reports the abort trace the
# SIGABRT handler prints. Remove once the crash is fixed.
name: Debug
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      - name: Configure ccache dir
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"

      - name: Cache mingw-w64 install
        uses: actions/cache@v4
        with:
          path: |
            C:\ProgramData\chocolatey\lib\mingw
            C:\ProgramData\chocolatey\lib\ccache
            C:\ProgramData\mingw64
            C:\tools\mingw64
          key: mingw-w64-Windows-choco-v2

      - name: Set up mingw-w64
        run: |
          find_mingw_bin() {
            { find /c/ProgramData/mingw64 /c/ProgramData/chocolatey/lib/mingw /c/tools -path '*/mingw64/bin' -type d 2>/dev/null || true; } |
              while read -r dir; do
                if [ -x "$dir/gcc.exe" ] || [ -x "$dir/gcc" ]; then
                  echo "$dir"
                  break
                fi
              done
          }
          mingw_bin="$(find_mingw_bin)"
          if [ -z "$mingw_bin" ]; then
            choco install -y --no-progress mingw
            mingw_bin="$(find_mingw_bin)"
          fi
          test -n "$mingw_bin"
          cygpath -w "$mingw_bin" >> "$GITHUB_PATH"
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "SC_CSTD=-std=gnu11 -D_POSIX_C_SOURCE=200809L" >> "$GITHUB_ENV"
          command -v ccache >/dev/null 2>&1 || choco install -y --no-progress ccache

      - name: Fetch bootstrap super-c from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          name="super-c-windows-$(uname -m)"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "${name}.zip" --dir . --clobber
          7z x -y "${name}.zip" >/dev/null
          if [ -f "${name}/super-c.exe" ]; then cp "${name}/super-c.exe" super-c-boot.exe; else cp "${name}.exe" super-c-boot.exe; fi
          test -x ./super-c-boot.exe

      - name: Build gen1
        run: SC_LEAK_CHECK=fatal ./super-c-boot.exe build --bootstrap-tags "--cstd=$SC_CSTD"

      - name: Run the probe
        run: SC_LEAK_CHECK=fatal ./super-c.exe test "--cstd=$SC_CSTD" --test-filter=dyn_fn_box_roundtrip

      - name: Upload gen1 binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-gen1
          path: super-c.exe
