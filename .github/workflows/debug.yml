# The permanent probe lane: whatever currently needs proving on a real runner lives here as the job
# content, run on demand from the Actions tab. Edit the jobs for the next investigation; do not remove
# the file. Current probe: this tree's compiler on every platform with a native backend (macOS arm64,
# Linux x86-64, Linux arm64, Windows x86-64): the test suite, leak-gated, in the release's shards, with
# the tests that link a C driver (SC_TEST_CC); the vector tests at x86-64-v3; the native tests under
# Intel SDE (AVX-512); the wasm lanes; and a thread-local program built on Windows, its output shown.
name: Debug
on:
  workflow_dispatch
permissions:
  contents: read
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    name: compile (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos }
          - { os: ubuntu-latest, target: linux }
          # No release ships a Linux arm64 compiler: the x86-64 runner cross-builds it against the arm64
          # C library. Both runners run Ubuntu 26.04: the arm64 runner's glibc.
          - { os: ubuntu-26.04, target: linux_arm64, platform: linux }
          - { os: windows-latest, target: windows }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: ${{ matrix.platform || matrix.target }}

      - name: Build the compiler
        run: |
          set -eu
          SC_LEAK_CHECK=fatal "./super-c-boot${BINEXT:-}" build --bootstrap-tags -fno-prove
          test -x "./super-c${BINEXT:-}"

      - name: Cross-build the arm64 compiler
        if: matrix.target == 'linux_arm64'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y libc6-dev-arm64-cross
          SC_LEAK_CHECK=fatal ./super-c build --target=linux --arch=aarch64 --sysroot=/usr/aarch64-linux-gnu --out-dir=build-a64 -o super-c-a64
          mv super-c-a64 super-c

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-${{ matrix.target }}
          path: super-c${{ env.BINEXT }}
          if-no-files-found: error
          retention-days: 1

  # The suite with the compiler `compile` built. Leak-gated: a process that leaks or double-frees exits
  # nonzero. The first shard of each target also checks the builds with LIR (SC_LIR).
  test:
    needs: compile
    name: test (${{ matrix.target }} ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos, shard: "1/2" }
          - { os: macos-latest, target: macos, shard: "2/2" }
          - { os: ubuntu-latest, target: linux, shard: "1/2" }
          - { os: ubuntu-latest, target: linux, shard: "2/2" }
          - { os: ubuntu-26.04-arm, target: linux_arm64, shard: "1/2" }
          - { os: ubuntu-26.04-arm, target: linux_arm64, shard: "2/2" }
          - { os: windows-latest, target: windows, shard: "1/3" }
          - { os: windows-latest, target: windows, shard: "2/3" }
          - { os: windows-latest, target: windows, shard: "3/3" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      - name: Run the test suite
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          chmod +x "./$bin"
          dur=tests/durations/${{ matrix.target }}.tsv; [ -f "$dur" ] || dur=tests/durations.tsv
          case "${{ matrix.shard }}" in 1/*) export SC_LIR=1 ;; esac
          case "${{ matrix.target }}" in windows) export SC_TEST_CC=gcc ;; *) export SC_TEST_CC=cc ;; esac
          SC_LEAK_CHECK=fatal "./$bin" test --quiet --test-shard=${{ matrix.shard }} --test-durations="$dur"

  # The vector tests at x86-64-v3 (BMI1, BMI2, MOVBE, AVX2, FMA) on the x86-64 runners.
  levels:
    needs: compile
    name: levels (${{ matrix.target }}, x86-64-v3)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux }
          - { os: windows-latest, target: windows }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      - name: Vector tests at x86-64-v3
        env:
          SC_SIMD_FEATURES: x86-64-v3
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          chmod +x "./$bin"
          SC_LEAK_CHECK=fatal "./$bin" test --quiet --test-timeout=900 --filter=simd_

  # The native tests under Intel SDE (an emulated Sapphire Rapids: AVX-512, BMI, MOVBE).
  avx512:
    needs: compile
    name: avx512 (linux, sde)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: linux
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-linux

      - name: Install Intel SDE
        run: |
          set -eu
          f=sde-external-10.13.1-2026-07-28-lin.tar.xz
          curl -fsSL --retry 3 -o "$f" "https://github.com/petarpetrovt/setup-sde/releases/download/binaries/$f"
          echo "94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50  $f" | sha256sum -c -
          mkdir sde
          tar -xJf "$f" -C sde --strip-components=1

      - name: Native tests with 64-byte vectors under SDE
        run: |
          set -eu
          chmod +x ./super-c
          SC_SDE="$PWD/sde/sde64 -spr --" SC_TEST_CC=cc SC_LEAK_CHECK=fatal ./super-c test --quiet --test-timeout=1800 --filter=native_test

  # The thread-local program of `thread_local_test` built and run on Windows, its build output shown.
  tls-windows:
    needs: compile
    name: thread-local (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: windows
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-windows

      - name: Build and run the program
        run: |
          set -u
          chmod +x ./super-c.exe
          mkdir -p tls && cd tls
          cat > main.spc <<'SPC'
          import pthread;

          @thread_local
          static mut COUNT: u64 = 7;

          fn worker(arg: *mut void) *mut void {
              unsafe COUNT += 1;
              return arg;
          }

          fn main() i32 {
              let mut t = unsafe zeroed::<pthread::pthread_t>();
              unsafe pthread::pthread_create(&mut t, null, worker, null);
              unsafe pthread::pthread_join(t, null);
              return (unsafe COUNT != 7) as i32;
          }
          SPC
          which gcc; gcc --version | head -1
          ../super-c.exe build main.spc -o prog.exe; echo "build=$?"
          ./prog.exe; echo "run=$?"

  # x86-64-v3 on a real x86-64 runner: release compilers for the baseline, x86-64-v3, the baseline with
  # v3's scalar features, and the baseline with AVX2 and FMA, each timed building the compiler,
  # alternating, three rounds.
  bench-v3:
    needs: compile
    name: bench (linux, x86-64-v3)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: linux
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-linux

      - name: Time the compilers by feature group
        run: |
          set -eu
          chmod +x ./super-c
          grep -m1 -o -w -E 'bmi1|bmi2|movbe|avx2' /proc/cpuinfo | sort -u | tr '\n' ' '; lscpu | grep -i 'model name' || true
          ./super-c build --profile=release -fno-prove --out-dir=b1 -o sc-v1
          ./super-c build --profile=release -fno-prove --target-cpu=x86-64-v3 --out-dir=b3 -o sc-v3
          ./super-c build --profile=release -fno-prove --target-feature=+bmi1,+bmi2,+movbe,+lzcnt,+popcnt --out-dir=bs -o sc-sc
          ./super-c build --profile=release -fno-prove --target-feature=+avx2,+fma --out-dir=bv -o sc-vec
          for r in 1 2 3; do
            for v in v1 v3 sc vec; do
              rm -rf "t-$v"
              s=$(date +%s.%N)
              "./sc-$v" build -fno-prove --out-dir="t-$v" -o "o-$v" > /dev/null
              e=$(date +%s.%N)
              echo "round $r $v: $(echo "$e - $s" | bc) s"
            done
          done

  # LSE and RCPC on a Linux arm64 server core: the mutex benchmarks built without them (the Linux
  # baseline) and with them, alternating, two rounds.
  bench-lse:
    needs: compile
    name: bench (linux_arm64, lse)
    runs-on: ubuntu-26.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: linux_arm64
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-linux_arm64

      - name: Time the mutex benchmarks with and without LSE
        run: |
          set -eu
          chmod +x ./super-c
          grep -m1 -o -w -E 'atomics|lrcpc' /proc/cpuinfo | sort -u | tr '\n' ' '; nproc; lscpu | grep -i -E 'model name|vendor' || true
          ./super-c bench --no-run --filter=mutex_ --out-dir=b0 > /dev/null
          ./super-c bench --no-run --filter=mutex_ --target-feature=+lse,+rcpc --out-dir=b1 > /dev/null
          for r in 1 2; do
            for v in b0 b1; do
              echo "== $v round $r"
              "./$v/bench-bin" | grep -E '^mutex_bench::|time \(ms\)'
            done
          done

  wasm-compile:
    name: wasm compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: linux

      - name: Build the native compiler
        run: SC_LEAK_CHECK=fatal ./super-c-boot build --bootstrap-tags -fno-prove

      - name: Build the wasm compiler
        run: ./super-c build --target=wasm --profile=release -o super-c.wasm

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-wasm
          path: |
            super-c
            super-c.wasm
          if-no-files-found: error
          retention-days: 1

  wasm-checks:
    needs: wasm-compile
    name: wasm checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          role: checks
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-wasm

      - name: Make the native compiler executable
        run: chmod +x ./super-c

      - name: Vector tests on wasm32 with simd128
        run: |
          SC_SIMD_LANE=wasm SC_LEAK_CHECK=fatal ./super-c test --quiet --test-timeout=900 --filter=simd_
          SC_SIMD_LANE=wasm SC_LEAK_CHECK=fatal ./super-c test --quiet --test-timeout=900 --filter=gen_vector_seeds

      - name: Self-host fixpoint under wasmtime
        run: |
          set -eu
          w=/tmp/wwasm
          mkdir -p "$w"
          cp -R src std ffi build.toml "$w/" && rm -rf "$w/src/build"
          cp super-c.wasm "$w/gen1.wasm"
          cd "$w"
          gen() {
            "$GITHUB_WORKSPACE/super-c" build --target=wasm --profile=release \
              --transpiler="wasmtime run --dir=/ --env WASI_SDK_PATH=$WASI_SDK_PATH --argv0 $w/$1 -- $w/$1" -o "$2"
          }
          gen gen1.wasm gen2.wasm
          cp -R build/release/raw /tmp/wasm-gen1
          gen gen2.wasm gen3.wasm
          diff -r --exclude=.tu_cache --exclude=__sc_hfacts /tmp/wasm-gen1 build/release/raw

  wasm-target:
    needs: wasm-compile
    name: wasm target (${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        test_shard: ["1/2", "2/2"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-wasm

      - name: Run the test suite with wasm32 programs
        run: |
          chmod +x ./super-c
          SC_TEST_TARGET=wasm SC_LEAK_CHECK=fatal ./super-c test --quiet --test-timeout=900 --test-shard=${{ matrix.test_shard }}

  wasm-test:
    needs: wasm-compile
    name: wasm test (${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        test_shard: ["1/2", "2/2"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-wasm

      - name: Run the test suite against the wasm compiler
        run: |
          chmod +x ./super-c
          dur=tests/durations/wasm.tsv; [ -f "$dur" ] || dur=tests/durations.tsv
          SC_TEST_SUPERC="$GITHUB_WORKSPACE/ci/wasm-superc.sh" SC_LEAK_CHECK=fatal ./super-c test --quiet --test-shard=${{ matrix.test_shard }} --test-durations="$dur"
