# The permanent probe lane: whatever currently needs proving on a real runner lives here as the job
# content, run on demand from the Actions tab. Edit the jobs for the next investigation; do not remove
# the file. Current probe: this tree's compiler on every platform with a native backend (macOS arm64,
# Linux x86-64, Linux arm64, Windows x86-64): the test suite, leak-gated, in the release's shards, and
# the self-compile benchmark, whose per-phase heap (MiB) must agree across the platforms. Then what
# the comparison and layout work costs and gains on each runner's processor: the cost of running a short
# function or loop across an address boundary (`boundary`), the code generation suite against the C
# kernels (`codegen`), and this tree's compiler against its parent commit's, second generation each: code
# size and the time of one native build (`text`).
name: Debug
on:
  workflow_dispatch
permissions:
  contents: read
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    name: compile (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos }
          - { os: ubuntu-latest, target: linux }
          # No release ships a Linux arm64 compiler: the x86-64 runner cross-builds it against the arm64
          # C library. Both runners run Ubuntu 26.04: the arm64 runner's glibc.
          - { os: ubuntu-26.04, target: linux_arm64, platform: linux }
          - { os: windows-latest, target: windows }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: ${{ matrix.platform || matrix.target }}

      - name: Build the compiler
        run: |
          set -eu
          SC_LEAK_CHECK=fatal "./super-c-boot${BINEXT:-}" build --bootstrap-tags
          test -x "./super-c${BINEXT:-}"

      - name: Cross-build the arm64 compiler
        if: matrix.target == 'linux_arm64'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y libc6-dev-arm64-cross
          SC_LEAK_CHECK=fatal ./super-c build --target=linux --arch=aarch64 --sysroot=/usr/aarch64-linux-gnu --out-dir=build-a64 -o super-c-a64
          mv super-c-a64 super-c

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-${{ matrix.target }}
          path: super-c${{ env.BINEXT }}
          if-no-files-found: error
          retention-days: 1

  # The suite with the compiler `compile` built. Leak-gated: a process that leaks or double-frees exits
  # nonzero. The first shard of each target also checks the builds with LIR (SC_LIR).
  test:
    needs: compile
    name: test (${{ matrix.target }} ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos, shard: "1/2" }
          - { os: macos-latest, target: macos, shard: "2/2" }
          - { os: ubuntu-latest, target: linux, shard: "1/2" }
          - { os: ubuntu-latest, target: linux, shard: "2/2" }
          - { os: ubuntu-26.04-arm, target: linux_arm64, shard: "1/2" }
          - { os: ubuntu-26.04-arm, target: linux_arm64, shard: "2/2" }
          - { os: windows-latest, target: windows, shard: "1/3" }
          - { os: windows-latest, target: windows, shard: "2/3" }
          - { os: windows-latest, target: windows, shard: "3/3" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      - name: Run the test suite
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          chmod +x "./$bin"
          dur=tests/durations/${{ matrix.target }}.tsv; [ -f "$dur" ] || dur=tests/durations.tsv
          case "${{ matrix.shard }}" in 1/*) export SC_LIR=1 ;; esac
          SC_LEAK_CHECK=fatal "./$bin" test --quiet --test-shard=${{ matrix.shard }} --test-durations="$dur"

  # The whole cold native self-build, rounds at one job and at one job per core, timed and counted per
  # phase. The heap per phase (MiB) is a property of the sources and the target's code, so the platforms
  # agree on it within the targets' differences; time and cycles follow each runner's machine.
  bench:
    needs: compile
    name: self-compile bench (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos }
          - { os: ubuntu-latest, target: linux }
          - { os: ubuntu-26.04-arm, target: linux_arm64 }
          - { os: windows-latest, target: windows }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      - name: Self-compile benchmark
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          chmod +x "./$bin"
          { grep -m1 'model name' /proc/cpuinfo || sysctl -n machdep.cpu.brand_string || true; } 2>/dev/null
          "./$bin" bench --filter=self_compile

  # What a short function, or the short loop that calls it, costs when a boundary of 64 to 65536 bytes
  # falls inside it, on this runner's processor (ci/boundary_cost.c places the machine code itself).
  # The code generation suite: each kernel as this tree compiles it against the runner's C compiler at -O2.
  codegen:
    needs: compile
    name: codegen suite (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos }
          - { os: ubuntu-latest, target: linux }
          - { os: ubuntu-26.04-arm, target: linux_arm64 }
          - { os: windows-latest, target: windows }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      # The parent commit's compiler, built by this tree's: the same runner times the kernels of both.
      - name: Code generation suite
        run: |
          set -euo pipefail
          x="${BINEXT:-}"
          native() { if command -v cygpath >/dev/null 2>&1; then cygpath -m "$1"; else echo "$1"; fi; }
          here="$(native "$PWD")"
          chmod +x "./super-c$x"
          git worktree add -q ../parent HEAD~1
          mkdir -p ../gen
          gen="$(native "$(cd ../gen && pwd)")"
          export SC_NO_CACHE=1 SC_NO_EMIT_CACHE=1 SC_NO_TU_CACHE=1
          ( cd ../parent && SC_STD_DIR="$(native "$PWD")/std" "$here/super-c$x" build --profile=release --out-dir="$gen/p-o" -o "$gen/parent$x" >"$gen/parent.log" 2>&1 ) \
            || { tail -20 "$gen/parent.log" || true; echo "BUILD FAILED: parent"; exit 1; }
          cp "./super-c$x" "$gen/new$x"
          export SC_STD_DIR="$here/std"
          sh bench/codegen/lib.sh
          {
            (grep -m1 'model name' /proc/cpuinfo || sysctl -n machdep.cpu.brand_string || wmic cpu get name || lscpu | grep -m1 'Model name') 2>/dev/null | head -2
            for r in 1 2; do
              for n in parent new; do
                echo "== $n round $r"
                "$gen/$n$x" bench --filter=codegen_
              done
            done
          } | tee codegen-${{ matrix.target }}.txt

      - uses: actions/upload-artifact@v7
        with:
          name: codegen-${{ matrix.target }}
          path: codegen-${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 3

  # This tree's compiler against its parent commit's, each the second generation (its code is its own
  # tree's code generation), both started from the compiler `compile` built: the sizes, and the time of
  # one native release build of this tree with one job, three times each in turn.
  text:
    needs: compile
    name: size and build time (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos }
          - { os: ubuntu-latest, target: linux }
          - { os: ubuntu-26.04-arm, target: linux_arm64 }
          - { os: windows-latest, target: windows }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      - name: Build both compilers and compare
        run: |
          set -euxo pipefail
          x="${BINEXT:-}"
          # A path the compiler takes on every runner.
          native() { if command -v cygpath >/dev/null 2>&1; then cygpath -m "$1"; else echo "$1"; fi; }
          here="$(native "$PWD")"
          chmod +x "./super-c$x"
          git worktree add -q ../parent HEAD~1
          mkdir -p ../gen
          gen="$(native "$(cd ../gen && pwd)")"
          export SC_NO_CACHE=1 SC_NO_EMIT_CACHE=1 SC_NO_TU_CACHE=1
          # two <tree> <name>: the tree's compiler built by the artifact, then by itself.
          two() {
            ( cd "$1" && export SC_STD_DIR="$(native "$PWD")/std" && "$here/super-c$x" build --profile=release --out-dir="$gen/$2-o1" -o "$gen/$2-1$x" >"$gen/$2-1.log" 2>&1 \
              && "$gen/$2-1$x" build --profile=release --out-dir="$gen/$2-o2" -o "$gen/$2-2$x" >"$gen/$2-2.log" 2>&1 ) \
              || { tail -20 "$gen/$2-1.log" "$gen/$2-2.log" || true; echo "BUILD FAILED: $2"; exit 1; }
          }
          two . new
          two ../parent parent
          {
            for n in parent new; do
              echo "$n: $(wc -c < "$gen/$n-2$x") bytes"
              size "$gen/$n-2$x" 2>/dev/null | tail -1 || true
            done
            TIMEFORMAT='%R s real, %U s user, %S s system'
            export SC_STD_DIR="$here/std"
            for r in 1 2 3; do
              for n in parent new; do
                printf '%s build %s: ' "$n" "$r"
                { time "$gen/$n-2$x" build --jobs=1 --profile=release --out-dir="$gen/t-o" -o "$gen/t$x" >"$gen/t.log" 2>&1; } 2>&1
                rm -rf "$gen/t-o"
              done
            done
          } | tee text-${{ matrix.target }}.txt

      - uses: actions/upload-artifact@v7
        with:
          name: text-${{ matrix.target }}
          path: text-${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 3
