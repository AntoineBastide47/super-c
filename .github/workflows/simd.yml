# The SIMD baselines of every CI platform: the kernel parity test, then bench/simd_baseline/record.sh,
# whose baseline.tsv each job uploads. Run on demand from the Actions tab.
name: SIMD
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: simd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    if: github.actor == github.repository_owner
    name: baseline (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            boot: linux
          - os: macos-latest
            target: macos
            boot: macos
          - os: windows-latest
            target: windows
            boot: windows
          - os: ubuntu-latest
            target: wasm
            boot: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          sha: ${{ github.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: ${{ matrix.boot }}

      - name: Build the compiler
        run: |
          set -eu
          "./super-c-boot${BINEXT:-}" build --bootstrap-tags
          [ -f "./super-c${BINEXT:-}" ] || mv ./super-c "./super-c${BINEXT:-}"

      # The wasm test runner is native: the benchmark's own parity check covers SIMD128.
      - name: Check the kernels and record the baselines
        run: |
          set -eu
          if [ "${{ matrix.target }}" = wasm ]; then
            sh bench/simd_baseline/record.sh --target=wasm
          else
            SC_TEST_CC=${CC:-cc} "./super-c${BINEXT:-}" test --quiet --filter=simd_baseline
            sh bench/simd_baseline/record.sh
            # x86_64: the portable kernels at AVX2 and, where the runner has it, AVX-512, each against
            # the hand-written kernels of its level (the arithmetic ones within 10%).
            if [ "${{ matrix.target }}" != macos ]; then
              sh bench/simd_baseline/record.sh --target-cpu=x86-64-v3
              if grep -qw avx512bw /proc/cpuinfo 2>/dev/null; then
                sh bench/simd_baseline/record.sh --target-cpu=x86-64-v4
              fi
            fi
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: simd-baseline-${{ matrix.target }}
          path: bench/simd_baseline/*.tsv
          if-no-files-found: error
