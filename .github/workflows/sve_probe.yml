# Probe: ffi/sc_sme.c under GCC 14, Clang 18 and Clang 19 on an Arm Linux runner, with variants that
# locate the Clang 18 rejection of SVE types in the streaming kernels.
name: SME compile probe
on:
  push:
    branches: [probe/sme-gather]
permissions:
  contents: read
jobs:
  sme:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Compile the SME kernels
        run: |
          set -u
          sudo apt-get update >/dev/null
          sudo apt-get install -y gcc-14 clang-19 >/dev/null
          F="-std=c11 -D_POSIX_C_SOURCE=200809L -funsigned-char -ffp-contract=off -O2 -Wall -Wextra -Werror"
          printf '#include <stdio.h>\n#include "sc_sme.h"\nint main(void) { printf("built %%d\\n", sc_sme_built()); return 0; }\n' >built.c
          try() {
            echo "== $1: $2"
            if $1 $F $3 -c "$4" -o sc_sme.o 2>err.txt && $1 -O2 -Iffi built.c sc_sme.o -o built; then ./built; else head -n 4 err.txt; fi
          }
          cp ffi/sc_sme.c v0.c
          sed 's/__arm_locally_streaming/__arm_streaming/' ffi/sc_sme.c >v1.c
          sed 's/target("sme,sme-f64f64")/target("+sme,+sme-f64f64")/' ffi/sc_sme.c >v2.c
          sed 's/target("sme,sme-f64f64")/target("arch=armv9-a+sme+sme-f64f64")/' ffi/sc_sme.c >v4.c
          for v in v0 v1 v2 v4; do sed -i 's/#include "sc_sme.h"/#include "ffi\/sc_sme.h"/' $v.c; done
          for cc in gcc-14 clang-18 clang-19; do $cc --version | head -n 1; try $cc "as is" "" v0.c; done
          try clang-18 "__arm_streaming kernels" "" v1.c
          try clang-18 "+ features in the pragma" "" v2.c
          try clang-18 "arch= in the pragma" "" v4.c
          try clang-18 "-march=armv8.2-a+sme" "-march=armv8.2-a+sme" v0.c
