name: Release

# Owner-only, manual-trigger release: builds the `super-c` binary for macOS, Linux and Windows and publishes
# a GitHub Release with one archive per platform.
#
# `commit` is what keeps a run of untagged commits from being all-or-nothing. Left empty the tag lands on the
# head of whatever branch this was dispatched from, so a single broken commit at the tip drags every good one
# behind it into the same release; naming an earlier commit builds, tests and tags exactly that one instead.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. v0.1.0)"
        required: true
        type: string
      commit:
        description: "Commit to build, test and tag (SHA, branch or tag; default: the dispatched branch head)"
        required: false
        type: string

permissions:
  contents: write            # needed to create the tag + release

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  # Settle what "this release is" exactly once, in one place. Whatever `commit` was given -- a short SHA, a
  # branch, a tag, or nothing at all -- becomes one full SHA that every job below checks out and that the
  # release is finally tagged on. Resolving it per job instead would reopen the hole this input exists to
  # close: a branch that moves mid-run would leave the tag on a commit the suite never built.
  resolve:
    # Only the repository owner may run this.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every commit, so an input naming an older one resolves

      - id: pick
        # Through the environment, not string interpolation: the input is a shell word here, and pasting it
        # into the script would let one carry its own quoting.
        env:
          WANT: ${{ github.event.inputs.commit }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          sha="$(git rev-parse --verify "${WANT:-$HEAD_SHA}^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing $sha ($(git log -1 --format=%s "$sha"))"

  build:
    needs: resolve
    if: github.actor == github.repository_owner
    name: build (${{ matrix.target }}, tests ${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            test_shard: "1/2"
            cache_shard: 1
            artifact: true
          - os: ubuntu-latest
            target: linux
            test_shard: "2/2"
            cache_shard: 2
            artifact: false
          - os: macos-latest
            target: macos
            test_shard: "1/1"
            cache_shard: 1
            artifact: true
          - os: windows-latest
            target: windows
            test_shard: "1/2"
            cache_shard: 1
            artifact: true
          - os: windows-latest
            target: windows
            test_shard: "2/2"
            cache_shard: 2
            artifact: false
    runs-on: ${{ matrix.os }}
    # Run every step in bash so the shared build steps behave identically on the Windows runner
    # (Git Bash), not just on Linux/macOS.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      # --- Toolchain cache -------------------------------------------------------------------------------
      # Cache the package-manager download areas so re-runs never re-fetch the C toolchain / any deps.
      # GitHub runners already ship a working `cc`, so nothing is installed by default -- these caches pay
      # off the moment a compiler/dep install is added below, and cost nothing otherwise. NOTE: only the
      # *installation* is cached; build OUTPUTS are never cached (see the Clean step).
      # Each test shard keeps its own ccache so parallel jobs can save all compiled test inputs.
      # CCACHE_DIR pins one workspace path on all OSes.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.target }}-${{ matrix.cache_shard }}-${{ needs.resolve.outputs.sha }}
          restore-keys: |
            ccache-${{ matrix.target }}-${{ matrix.cache_shard }}-
            ccache-${{ matrix.target }}-

      - name: Configure ccache dir
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"

      - name: Cache Homebrew downloads (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Caches/Homebrew/downloads
          key: cc-brew-${{ runner.os }}-${{ hashFiles('build.toml') }}
          restore-keys: cc-brew-${{ runner.os }}-

      - name: Cache apt archives (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: cc-apt-${{ runner.os }}-${{ hashFiles('build.toml') }}
          restore-keys: cc-apt-${{ runner.os }}-

      - name: Set up C compiler + ccache (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v cc >/dev/null 2>&1; then
            brew install llvm
            echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
            echo "CC=clang" >> "$GITHUB_ENV"
          fi
          command -v ccache >/dev/null 2>&1 || brew install ccache

      - name: Set up C compiler + ccache (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v cc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y build-essential
          fi
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi

      - name: Cache mingw-w64 install (Windows)
        if: runner.os == 'Windows'
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: |
            C:\ProgramData\chocolatey\lib\mingw
            C:\ProgramData\chocolatey\lib\ccache
            C:\ProgramData\mingw64
            C:\tools\mingw64
          key: mingw-w64-${{ runner.os }}-choco-v2
          restore-keys: mingw-w64-${{ runner.os }}-

      # Add compiler/dep installs here if ever needed (e.g. a pinned clang/gcc, libomp); their downloads
      # land in the caches above. The default build needs only the preinstalled `cc`.
      # Windows ships no Unix C toolchain; pull in mingw-w64 gcc + GNU make. The compiler source is
      # mingw-clean: realpath/dirent/unistd are provided and it makes no real fork/popen/mmap call.
      - name: Set up mingw-w64 (Windows)
        if: runner.os == 'Windows'
        run: |
          find_mingw_bin() {
            { find /c/ProgramData/mingw64 /c/ProgramData/chocolatey/lib/mingw /c/tools -path '*/mingw64/bin' -type d 2>/dev/null || true; } |
              while read -r dir; do
                if [ -x "$dir/gcc.exe" ] || [ -x "$dir/gcc" ]; then
                  echo "$dir"
                  break
                fi
              done
          }
          mingw_bin="$(find_mingw_bin)"
          if [ -z "$mingw_bin" ]; then
            choco install -y --no-progress mingw
            mingw_bin="$(find_mingw_bin)"
          fi
          test -n "$mingw_bin"
          cygpath -w "$mingw_bin" >> "$GITHUB_PATH"
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "BINEXT=.exe" >> "$GITHUB_ENV"
          command -v ccache >/dev/null 2>&1 || choco install -y --no-progress ccache

      # --- Clean outputs only ---------------------------------------------------------------------------
      - name: Clean release outputs
        run: rm -rf build src/build ci/build super-c super-c.exe* super-c-boot* smoke*

      # --- Bootstrap ------------------------------------------------------------------------------------
      # The fetched binary lands beside the checkout under its own name, never as `super-c`: it resolves
      # std/ffi relative to its OWN executable, so at the repo root it picks up the current std/ffi (which
      # is the point of --bootstrap-tags), and a distinct name keeps it intact instead of having the first
      # build replace the very binary that is producing it.
      - name: Fetch bootstrap super-c from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          arch="$(uname -m)"
          name="super-c-${{ matrix.target }}-${arch}"
          boot="super-c-boot${BINEXT:-}"
          if [ "${{ matrix.target }}" = windows ]; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern "${name}.zip" --dir . --clobber
            7z x -y "${name}.zip" >/dev/null
            if [ -f "${name}/super-c.exe" ]; then cp "${name}/super-c.exe" "$boot"; else cp "${name}.exe" "$boot"; fi
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern "${name}.tar.gz" --dir . --clobber
            tar xzf "${name}.tar.gz"
            if [ -f "${name}/super-c" ]; then cp "${name}/super-c" "$boot"; else cp "${name}" "$boot"; fi
            chmod +x "$boot"
          fi
          test -x "./$boot"
          # mingw hides the POSIX prototypes under -std=c11's __STRICT_ANSI__, so the Windows leg overrides
          # the manifest's base C flags. Empty elsewhere, which leaves the manifest's own value alone.
          if [ "${{ runner.os }}" = Windows ]; then
            echo "SC_CSTD=-std=gnu11 -D_POSIX_C_SOURCE=200809L" >> "$GITHUB_ENV"
          fi

      # --- Build: debug from the bootstrap, then the suite, then release over the same binary ------------
      # Every step goes through the build engine (parallel compile + ccache) on every platform -- no
      # hand-written compiler invocation, which is what used to make the Windows leg three times slower.
      # `build` and `release` also INSTALL their result as `super-c`, over the binary running the build:
      # each profile links its own copy under <out-dir>/<profile>/ and the install renames a fresh file onto
      # the name (sc_rename parks a running Windows image aside; Windows forbids deleting a live image but
      # permits renaming one). `test` deliberately does not install -- it runs the profile's copy where it
      # lies, so a run of the suite can never leave a dev binary where the release artifact was.
      - name: Build the compiler
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          boot="./super-c-boot${BINEXT:-}"
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          SC_LEAK_CHECK=fatal "$boot" build --bootstrap-tags ${cstd:+"$cstd"}
          # Compatibility with a bootstrap older than the `.exe` naming fix: it links the manifest's `bin`
          # verbatim, so on Windows it produces an extensionless PE that nothing can launch. Every step
          # after this one is built by the compiler we just made, which names it correctly. Drop this once
          # a release has shipped with the fix.
          [ -f "./$bin" ] || mv "./super-c" "./$bin"
          test -x "./$bin"

      # The full suite, on every platform, with the binary this commit just produced -- so a failure is a
      # failure of this code, not of the bootstrap. Leak-gated: every process in the run exits nonzero if it
      # leaks, double-frees or uses freed memory. `test` rebuilds the project first and so relinks `super-c`
      # while `super-c` is the process running: see sc_rename for why that is allowed even on Windows.
      - name: Run the test suite
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          SC_LEAK_CHECK=fatal "./$bin" test --quiet --test-shard=${{ matrix.test_shard }} ${cstd:+"$cstd"}

      - name: Build the release binary
        if: matrix.artifact
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          # 2) release build, by the binary step 1 produced, over itself
          SC_LEAK_CHECK=fatal "./$bin" release ${cstd:+"$cstd"}
          test -x "./$bin"
          if [ "${{ runner.os }}" != Windows ]; then file "./$bin"; fi

      # The concurrency runtime end to end -- OS threads, an Arc'd mutex and atomics across them, coroutines
      # on the worker pool, channels, `select`, the data-parallel API and the timer list -- built and run by
      # the release binary, so the artifact that ships is the one that was exercised.
      - name: Run the concurrency smoke test
        if: matrix.artifact
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          smoke="smoke${BINEXT:-}"
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          "./$bin" build ci/parallel_smoke.spc -o "$smoke" ${cstd:+"$cstd"}
          SC_LEAK_CHECK=fatal "./$smoke"

      # --- Package one archive per platform -------------------------------------------------------------
      - name: Package
        if: matrix.artifact
        run: |
          set -eu
          arch="$(uname -m)"
          name="super-c-${{ matrix.target }}-${arch}"
          bin="super-c${BINEXT:-}" # the release build -- the one the suite and the smoke test just ran
          mkdir -p "dist/${name}"
          if [ "${{ matrix.target }}" = windows ]; then
            cp "$bin" "dist/${name}/super-c.exe"
            cp -R std ffi "dist/${name}/"
            ( cd dist && 7z a -bso0 "../${name}.zip" "${name}" )
            echo "ASSET=${name}.zip" >> "$GITHUB_ENV"
          else
            cp "$bin" "dist/${name}/super-c"
            cp -R std ffi "dist/${name}/"
            tar -C dist -czf "${name}.tar.gz" "${name}"
            echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"
          fi

      - if: matrix.artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # The wasm leg: the compiler cross-built to wasm32-wasip1 and put through the SAME suite -- every
  # transpile-class invocation runs inside wasmtime (via ci/wasm-superc.sh), the emitted C compiles
  # with the host cc, and the test binaries run natively. WASI has no processes, so the engine's cc
  # and the test runner stay native; the split lives in the wrapper. The self-transpile byte-diff
  # against the native binary is the exactness oracle on top.
  wasm:
    needs: resolve
    if: github.actor == github.repository_owner
    name: wasm (tests ${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_shard: "1/2"
            cache_shard: 1
            artifact: true
          - test_shard: "2/2"
            cache_shard: 2
            artifact: false
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-wasm-${{ matrix.cache_shard }}-${{ needs.resolve.outputs.sha }}
          restore-keys: |
            ccache-wasm-${{ matrix.cache_shard }}-
            ccache-wasm-
            ccache-linux-

      - name: Configure ccache dir
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          command -v ccache >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ccache; }

      - name: Cache wasi toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/wasi-sdk
            ~/.wasmtime
          key: wasi-toolchain-sdk25-v1

      - name: Set up wasi-sdk + wasmtime
        run: |
          set -eu
          if [ ! -x "$HOME/wasi-sdk/bin/clang" ]; then
            curl -sSfL -o /tmp/wasi-sdk.tar.gz \
              https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
            mkdir -p "$HOME/wasi-sdk"
            tar -xzf /tmp/wasi-sdk.tar.gz -C "$HOME/wasi-sdk" --strip-components=1
          fi
          if [ ! -x "$HOME/.wasmtime/bin/wasmtime" ]; then
            curl -sSf https://wasmtime.dev/install.sh | bash
          fi
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Fetch bootstrap super-c from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          name="super-c-linux-x86_64"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "${name}.tar.gz" --dir . --clobber
          tar xzf "${name}.tar.gz"
          if [ -f "${name}/super-c" ]; then cp "${name}/super-c" super-c-boot; else cp "${name}" super-c-boot; fi
          chmod +x ./super-c-boot

      - name: Build the native compiler
        run: SC_LEAK_CHECK=fatal ./super-c-boot build --bootstrap-tags

      - name: Build the wasm compiler
        run: |
          set -eu
          rm -rf src/build
          ./super-c src/main.spc --target=wasm
          "$HOME/wasi-sdk/bin/clang" -O2 -std=gnu11 -D_POSIX_C_SOURCE=200809L \
            -D_WASI_EMULATED_SIGNAL -lwasi-emulated-signal \
            -Wl,-z,stack-size=8388608 -Wl,--stack-first \
            $(find src/build/raw -name '*.c') -lm -o super-c.wasm
          rm -rf src/build

      # The self-hosting fixpoint, on wasm: gen1 (the artifact) transpiles the WHOLE COMPILER under
      # wasmtime, that tree builds gen2, and gen2's emission of the same input must be byte-identical.
      # Emission is path-dependent (hashes mix path strings), so gen2 emits at the SAME path gen1 did.
      # (No byte-diff against the native binary: instance homing follows hash orders that differ
      # between 32- and 64-bit hosts.) The tree carries its own compiler: std/ffi resolve beside the
      # binary, and inputs are absolute because wasmtime's guest cwd is "/".
      - name: Self-host fixpoint under wasmtime
        run: |
          set -eu
          mkdir -p /tmp/wwasm
          cp -R src std ffi /tmp/wwasm/ && rm -rf /tmp/wwasm/src/build
          cp super-c.wasm /tmp/wwasm/
          wasmtime run --dir=/ --argv0 /tmp/wwasm/super-c.wasm -- \
            /tmp/wwasm/super-c.wasm /tmp/wwasm/src/main.spc --target=wasm 2>/tmp/wasm-err.txt \
            || { head -60 /tmp/wasm-err.txt; exit 1; }
          # warnings (unused-pub etc.) are expected; any error line is not
          if grep -m1 -E '^error' /tmp/wasm-err.txt; then head -40 /tmp/wasm-err.txt; exit 1; fi
          mv /tmp/wwasm/src/build /tmp/wasm-gen1
          "$HOME/wasi-sdk/bin/clang" -O1 -std=gnu11 -D_POSIX_C_SOURCE=200809L \
            -D_WASI_EMULATED_SIGNAL -lwasi-emulated-signal \
            -Wl,-z,stack-size=8388608 -Wl,--stack-first \
            $(find /tmp/wasm-gen1/raw -name '*.c') -lm -o /tmp/wwasm/gen2.wasm
          wasmtime run --dir=/ --argv0 /tmp/wwasm/gen2.wasm -- \
            /tmp/wwasm/gen2.wasm /tmp/wwasm/src/main.spc --target=wasm 2>/dev/null
          diff -r /tmp/wasm-gen1 /tmp/wwasm/src/build

      - name: Run the test suite against the wasm compiler
        run: SC_TEST_SUPERC="$GITHUB_WORKSPACE/ci/wasm-superc.sh" SC_LEAK_CHECK=fatal ./super-c test --quiet --test-shard=${{ matrix.test_shard }}

      - name: Package
        if: matrix.artifact
        run: |
          set -eu
          name="super-c-wasm32-wasip1"
          mkdir -p "dist/${name}"
          cp super-c.wasm "dist/${name}/"
          cp -R std ffi "dist/${name}/"
          tar -C dist -czf "${name}.tar.gz" "${name}"

      - if: matrix.artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: super-c-wasm32-wasip1.tar.gz
          if-no-files-found: error

  release:
    needs: [resolve, build, wasm]
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The SHA the matrix actually built and tested, never a branch name: a tag is only worth anything
          # if it names the commit the suite passed on.
          gh release create "${{ github.event.inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ needs.resolve.outputs.sha }}" \
            --title "${{ github.event.inputs.tag }}" \
            --generate-notes \
            dist/*
