name: Release

# Owner-only, manual-trigger release: builds the checked-in C snapshot in src/build for macOS, Linux and
# Windows and publishes a GitHub Release with one archive per platform.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write            # needed to create the tag + release

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    # Only the repository owner may run this.
    if: github.actor == github.repository_owner
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    # Run every step in bash so the shared build steps behave identically on the Windows runner
    # (Git Bash), not just on Linux/macOS.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # --- Toolchain cache -------------------------------------------------------------------------------
      # Cache the package-manager download areas so re-runs never re-fetch the C toolchain / any deps.
      # GitHub runners already ship a working `cc`, so nothing is installed by default -- these caches pay
      # off the moment a compiler/dep install is added below, and cost nothing otherwise. NOTE: only the
      # *installation* is cached; build OUTPUTS are never cached (see the Clean step).
      - name: Cache Homebrew downloads (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Caches/Homebrew/downloads
          key: cc-brew-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: cc-brew-${{ runner.os }}-

      - name: Cache apt archives (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: cc-apt-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: cc-apt-${{ runner.os }}-

      - name: Set up C compiler (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v cc >/dev/null 2>&1; then
            brew install llvm
            echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
            echo "CC=clang" >> "$GITHUB_ENV"
          fi

      - name: Set up C compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v cc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y build-essential
          fi

      - name: Cache mingw-w64 install (Windows)
        if: runner.os == 'Windows'
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: |
            C:\ProgramData\chocolatey\lib\mingw
            C:\ProgramData\mingw64
            C:\tools\mingw64
          key: mingw-w64-${{ runner.os }}-choco-v1
          restore-keys: mingw-w64-${{ runner.os }}-

      # Add compiler/dep installs here if ever needed (e.g. a pinned clang/gcc, libomp); their downloads
      # land in the caches above. The default build needs only the preinstalled `cc`.
      # Windows ships no Unix C toolchain; pull in mingw-w64 gcc. The compiler source is
      # mingw-clean: realpath/dirent/unistd are provided and it makes no real fork/popen/mmap call.
      - name: Set up mingw-w64 (Windows)
        if: runner.os == 'Windows'
        run: |
          find_mingw_bin() {
            { find /c/ProgramData/mingw64 /c/ProgramData/chocolatey/lib/mingw /c/tools -path '*/mingw64/bin' -type d 2>/dev/null || true; } |
              while read -r dir; do
                if [ -x "$dir/gcc.exe" ] || [ -x "$dir/gcc" ]; then
                  echo "$dir"
                  break
                fi
              done
          }
          mingw_bin="$(find_mingw_bin)"
          if [ -z "$mingw_bin" ]; then
            choco install -y --no-progress mingw
            mingw_bin="$(find_mingw_bin)"
          fi
          test -n "$mingw_bin"
          cygpath -w "$mingw_bin" >> "$GITHUB_PATH"
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "BINEXT=.exe" >> "$GITHUB_ENV"

      # --- Clean outputs only: src/build is the checked-in C input tree. ---------------------------------
      - name: Clean release outputs
        run: rm -rf build dist super-c super-c.exe super-c.new super-c.exe.new stage1-super-c stage1-super-c.exe *.out profile.json.gz

      - name: Build release binary
        # Compile the committed src/build C snapshot directly. mingw hides POSIX prototypes under
        # -std=c11's __STRICT_ANSI__, so the Windows leg uses gnu11.
        run: |
          set -eu
          test -d src/build
          cstd="-std=c11 -D_POSIX_C_SOURCE=200809L"
          if [ "${{ runner.os }}" = Windows ]; then
            cstd="-std=gnu11 -D_POSIX_C_SOURCE=200809L"
          fi
          bin="super-c${BINEXT:-}"
          cc_bin="${CC:-cc}"
          "$cc_bin" $cstd -O3 -DNDEBUG -finline-functions -fomit-frame-pointer -ffunction-sections -fdata-sections \
            $(find src/build -name '*.c' | sort) -o "$bin" -lm
          strip "$bin" 2>/dev/null || true

      - name: Check binary
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          test -x "./$bin"
          if [ "${{ runner.os }}" != Windows ]; then file "./$bin"; fi

      # --- Package one archive per platform -------------------------------------------------------------
      - name: Package
        run: |
          set -eu
          arch="$(uname -m)"
          name="super-c-${{ matrix.target }}-${arch}"
          bin="super-c${BINEXT:-}"
          mkdir -p "dist/${name}"
          if [ "${{ matrix.target }}" = windows ]; then
            cp "$bin" "dist/${name}/super-c.exe"
            cp -R std ffi "dist/${name}/"
            ( cd dist && 7z a -bso0 "../${name}.zip" "${name}" )
            echo "ASSET=${name}.zip" >> "$GITHUB_ENV"
          else
            cp "$bin" "dist/${name}/super-c"
            cp -R std ffi "dist/${name}/"
            tar -C dist -czf "${name}.tar.gz" "${name}"
            echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "${{ github.event.inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${{ github.event.inputs.tag }}" \
            --generate-notes \
            dist/*
