name: Release

# Owner-only, manual-trigger release: builds the `super-c` binary for macOS, Linux and Windows and publishes a
# GitHub Release with one tarball per platform. It is dispatch-only (never runs on push/PR), and every job
# is gated to the repository owner, so only the owner can start it. (In a public repo the workflow file is
# still readable; the guard controls who can RUN it. Make the repo private to also restrict who can see it.)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write            # needed to create the tag + release

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    # Only the repository owner may run this.
    if: github.actor == github.repository_owner
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    # Run every step in bash so the shared build steps behave identically on the Windows runner
    # (Git Bash), not just on Linux/macOS.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # --- Toolchain cache -------------------------------------------------------------------------------
      # Cache the package-manager download areas so re-runs never re-fetch the C toolchain / any deps.
      # GitHub runners already ship a working `cc`, so nothing is installed by default -- these caches pay
      # off the moment a compiler/dep install is added below, and cost nothing otherwise. NOTE: only the
      # *installation* is cached; build OUTPUTS are never cached (see the Clean step).
      - name: Cache Homebrew downloads (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Caches/Homebrew/downloads
          key: cc-brew-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: cc-brew-${{ runner.os }}-

      - name: Cache apt archives (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: cc-apt-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: cc-apt-${{ runner.os }}-

      - name: Cache mingw-w64 install (Windows)
        if: runner.os == 'Windows'
        id: cache-mingw
        uses: actions/cache@v4
        with:
          path: |
            C:\ProgramData\chocolatey\lib\mingw
            C:\ProgramData\mingw64
            C:\tools\mingw64
          key: mingw-w64-${{ runner.os }}-choco-v1

      # Add compiler/dep installs here if ever needed (e.g. a pinned clang/gcc, libomp); their downloads
      # land in the caches above. The default build needs only the preinstalled `cc`.
      # Windows ships no Unix C toolchain; pull in mingw-w64 gcc + GNU make. The compiler source is
      # mingw-clean: realpath/dirent/unistd are provided and it makes no real fork/popen/mmap call.
      - name: Set up mingw-w64 + make (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y --no-progress make
          if [ "${{ steps.cache-mingw.outputs.cache-hit }}" != true ]; then
            choco install -y --no-progress mingw
          fi
          mingw_bin="$({ find /c/ProgramData/mingw64 /c/ProgramData/chocolatey/lib/mingw /c/tools -path '*/mingw64/bin' -type d 2>/dev/null || true; } | head -n 1)"
          test -n "$mingw_bin"
          cygpath -w "$mingw_bin" >> "$GITHUB_PATH"
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "BINEXT=.exe" >> "$GITHUB_ENV"

      # --- Clean build (never reuse cached build files) --------------------------------------------------
      - name: Clean any build tree
        run: rm -rf build dist *.out profile.json.gz super-c.new "super-c${BINEXT:-}"

      # --- Bootstrap ------------------------------------------------------------------------------------
      # The build is self-hosted: `make` needs an existing super-c ($(SUPERC)) to transpile the .spc
      # sources. Download this platform's binary from the latest release to use as the bootstrap. (The very
      # first release -- and any release introducing a tag/flag the previous release's binary lacks -- must
      # be seeded once by publishing a locally-built binary as a release; every run after that self-sustains.)
      - name: Fetch bootstrap super-c from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          arch="$(uname -m)"
          name="super-c-${{ matrix.target }}-${arch}"
          if [ "${{ matrix.target }}" = windows ]; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern "${name}.zip" --dir . --clobber
            7z x -y "${name}.zip" >/dev/null
            if [ -f "${name}/super-c.exe" ]; then
              mv "${name}/super-c.exe" super-c.exe
            else
              mv "${name}.exe" super-c.exe
            fi
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern "${name}.tar.gz" --dir . --clobber
            tar xzf "${name}.tar.gz"
            if [ -f "${name}/super-c" ]; then
              mv "${name}/super-c" super-c
            else
              mv "${name}" super-c
            fi
            chmod +x super-c
          fi

      - name: Build release binary
        # mingw hides POSIX prototypes (realpath, ...) under -std=c11's __STRICT_ANSI__; build the
        # Windows leg with -std=gnu11 (same POSIX define) so they are declared. mingw links their
        # implementations from libmingwex automatically. Other platforms keep the Makefile default.
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          test -n "$(find src/build -name '*.c' -print -quit)"
          if [ "${{ runner.os }}" = Windows ]; then
            ${CC:-cc} -std=gnu11 -D_POSIX_C_SOURCE=200809L $(find src/build -name '*.c') -o "$bin" -lm
          else
            ${CC:-cc} -std=c11 -D_POSIX_C_SOURCE=200809L $(find src/build -name '*.c') -o "$bin" -lm
          fi

      - name: Check binary
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          test -x "./$bin"
          if [ "${{ runner.os }}" != Windows ]; then file "./$bin"; fi

      # --- Package one archive per platform -------------------------------------------------------------
      - name: Package
        run: |
          set -eu
          arch="$(uname -m)"
          name="super-c-${{ matrix.target }}-${arch}"
          bin="super-c${BINEXT:-}"
          mkdir -p "dist/${name}"
          if [ "${{ matrix.target }}" = windows ]; then
            cp "$bin" "dist/${name}/super-c.exe"
            cp -R std ffi "dist/${name}/"
            ( cd dist && 7z a -bso0 "../${name}.zip" "${name}" )
            echo "ASSET=${name}.zip" >> "$GITHUB_ENV"
          else
            cp "$bin" "dist/${name}/super-c"
            cp -R std ffi "dist/${name}/"
            tar -C dist -czf "${name}.tar.gz" "${name}"
            echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "${{ github.event.inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${{ github.event.inputs.tag }}" \
            --generate-notes \
            dist/*
