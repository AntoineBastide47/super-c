name: Release

# Owner-only, manual-trigger release: builds the `super-c` binary for macOS, Linux and Windows and publishes
# a GitHub Release with one archive per platform.
#
# `commit` is what keeps a run of untagged commits from being all-or-nothing. Left empty the tag lands on the
# head of whatever branch this was dispatched from, so a single broken commit at the tip drags every good one
# behind it into the same release; naming an earlier commit builds, tests and tags exactly that one instead.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. v0.1.0)"
        required: true
        type: string
      commit:
        description: "Commit to build, test and tag (SHA, branch or tag; default: the dispatched branch head)"
        required: false
        type: string

permissions:
  contents: write            # needed to create the tag + release

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  # Settle what "this release is" exactly once, in one place. Whatever `commit` was given -- a short SHA, a
  # branch, a tag, or nothing at all -- becomes one full SHA that every job below checks out and that the
  # release is finally tagged on. Resolving it per job instead would reopen the hole this input exists to
  # close: a branch that moves mid-run would leave the tag on a commit the suite never built.
  resolve:
    # Only the repository owner may run this.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit, so an input naming an older one resolves

      - id: pick
        # Through the environment, not string interpolation: the input is a shell word here, and pasting it
        # into the script would let one carry its own quoting.
        env:
          WANT: ${{ github.event.inputs.commit }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          sha="$(git rev-parse --verify "${WANT:-$HEAD_SHA}^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing $sha ($(git log -1 --format=%s "$sha"))"

  # The pipeline of macOS, Linux, Windows and wasm: one job builds the compiler, the two test shards and
  # (on macOS and Linux) the correctness gate run in parallel on that binary, and the release binary is
  # built only after all of them pass:
  #
  #   compile --+--> test 1/2 ------------------+
  #             +--> test 2/2 ------------------+--> package --> release
  #             +--> gate (macOS and Linux) ----+
  #
  # Jobs share no files: `compile` uploads the compiler it built, and every later job downloads it (an
  # artifact keeps no file modes, hence the chmod).

  # --- macOS, Linux and Windows -----------------------------------------------------------------------
  compile:
    needs: resolve
    if: github.actor == github.repository_owner
    name: compile (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    # Every step in bash, so the shared steps behave identically on the Windows runner (Git Bash).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          cache: ccache-${{ matrix.target }}-build
          sha: ${{ needs.resolve.outputs.sha }}

      - name: Clean release outputs
        run: rm -rf build src/build ci/build super-c super-c.exe* super-c-boot* smoke*

      - uses: ./.github/actions/bootstrap
        with:
          target: ${{ matrix.target }}

      - name: Build the compiler
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          SC_LEAK_CHECK=fatal "./super-c-boot${BINEXT:-}" build --bootstrap-tags ${cstd:+"$cstd"}
          # Compatibility with a bootstrap older than the `.exe` naming fix: it links the manifest's `bin`
          # verbatim, so on Windows it produces an extensionless PE that nothing can launch. Drop this once
          # a release has shipped with the fix.
          [ -f "./$bin" ] || mv "./super-c" "./$bin"
          test -x "./$bin"

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-${{ matrix.target }}
          path: super-c${{ env.BINEXT }}
          if-no-files-found: error
          retention-days: 1

  test:
    needs: [resolve, compile]
    if: github.actor == github.repository_owner
    name: test (${{ matrix.target }}, ${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            test_shard: "1/2"
            cache_shard: 1
          - os: macos-latest
            target: macos
            test_shard: "2/2"
            cache_shard: 2
          - os: ubuntu-latest
            target: linux
            test_shard: "1/2"
            cache_shard: 1
          - os: ubuntu-latest
            target: linux
            test_shard: "2/2"
            cache_shard: 2
          - os: windows-latest
            target: windows
            test_shard: "1/2"
            cache_shard: 1
          - os: windows-latest
            target: windows
            test_shard: "2/2"
            cache_shard: 2
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          cache: ccache-${{ matrix.target }}-${{ matrix.cache_shard }}
          sha: ${{ needs.resolve.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      # The suite with the binary `compile` produced, so a failure is a failure of this code, not of the
      # bootstrap. Leak-gated: every process in the run exits nonzero if it leaks or double-frees. `test`
      # rebuilds the project first and so relinks `super-c` while `super-c` is the process running: see
      # sc_rename for why that is allowed even on Windows.
      - name: Run the test suite
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          chmod +x "./$bin"
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          SC_LEAK_CHECK=fatal "./$bin" test --quiet --test-shard=${{ matrix.test_shard }} ${cstd:+"$cstd"}

  # The correctness gate beside the shards: it needs only the compiler, not their results.
  gate:
    needs: [resolve, compile]
    if: github.actor == github.repository_owner
    name: gate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          cache: ccache-${{ matrix.target }}-gate
          sha: ${{ needs.resolve.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      # ci/gate.sh without its check.sh step, which `compile` and `test` replace: the two-generation
      # fixpoint, the worker-count identity under each task-delay seed, the strict C warnings, and every
      # built-in profile but dev.
      - name: Run the correctness gate
        run: |
          chmod +x ./super-c
          sh ci/gate.sh --no-check

  # The release binary, built by the compiler the suite and the gate passed with.
  package:
    needs: [resolve, compile, test, gate]
    if: github.actor == github.repository_owner
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          cache: ccache-${{ matrix.target }}-release
          sha: ${{ needs.resolve.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      - name: Build the release binary
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          chmod +x "./$bin"
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          SC_LEAK_CHECK=fatal "./$bin" release ${cstd:+"$cstd"}
          test -x "./$bin"
          if [ "${{ runner.os }}" != Windows ]; then file "./$bin"; fi

      # The concurrency runtime end to end -- OS threads, an Arc'd mutex and atomics across them, coroutines
      # on the worker pool, channels, `select`, the data-parallel API and the timer list -- built and run by
      # the release binary, so the artifact that ships is the one that was exercised.
      - name: Run the concurrency smoke test
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          smoke="smoke${BINEXT:-}"
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          "./$bin" build ci/parallel_smoke.spc -o "$smoke" ${cstd:+"$cstd"}
          SC_LEAK_CHECK=fatal "./$smoke"

      - name: Package
        run: |
          set -eu
          name="super-c-${{ matrix.target }}-$(uname -m)"
          bin="super-c${BINEXT:-}"
          mkdir -p "dist/${name}"
          if [ "${{ matrix.target }}" = windows ]; then
            cp "$bin" "dist/${name}/super-c.exe"
            cp -R std ffi "dist/${name}/"
            ( cd dist && 7z a -bso0 "../${name}.zip" "${name}" )
            echo "ASSET=${name}.zip" >> "$GITHUB_ENV"
          else
            cp "$bin" "dist/${name}/super-c"
            cp -R std ffi "dist/${name}/"
            tar -C dist -czf "${name}.tar.gz" "${name}"
            echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # --- wasm ------------------------------------------------------------------------------------------
  # The compiler cross-built to wasm32-wasip1 and put through the SAME suite: every transpile-class
  # invocation runs inside wasmtime (via ci/wasm-superc.sh), the emitted C compiles with the host cc,
  # and the test binaries run natively. WASI has no processes, so the engine's cc and the test runner
  # stay native; the split lives in the wrapper. The self-hosting fixpoint under wasmtime is the
  # exactness oracle on top.
  wasm-compile:
    needs: resolve
    if: github.actor == github.repository_owner
    name: wasm compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          cache: ccache-wasm-build
          sha: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: linux

      - name: Build the native compiler
        run: SC_LEAK_CHECK=fatal ./super-c-boot build --bootstrap-tags

      # The build engine cross-compiles with the wasi-sdk (sysroot, emulation libraries, stack size).
      - name: Build the wasm compiler
        run: ./super-c build --target=wasm --profile=release -o super-c.wasm

      # The vector conformance lane: every vector test program, and the vector generator model's fixed
      # seeds, build for wasm32 with +simd128, run under wasmtime, and match the same program built
      # without the feature or the scalar model.
      - name: Vector tests on wasm32 with simd128
        run: |
          SC_SIMD_LANE=wasm SC_LEAK_CHECK=fatal ./super-c test --quiet --test-timeout=900 --filter=simd_
          SC_SIMD_LANE=wasm SC_LEAK_CHECK=fatal ./super-c test --quiet --test-timeout=900 --filter=gen_vector_seeds

      # The self-hosting fixpoint, on wasm: the build engine builds gen2 from the whole compiler with gen1
      # (the artifact) as its transpiler under wasmtime, then gen3 with gen2 as its transpiler, and
      # gen2's emission must be byte-identical to gen1's. WASI has no processes, so the native engine
      # runs the transpile step through `--transpiler` and compiles and links with its own wasm target
      # flags. Emission is path-dependent (hashes mix path strings), so both emit from the SAME project
      # copy. (No byte-diff against the native binary: instance homing follows hash orders that differ
      # between 32- and 64-bit hosts.) The copy carries each transpiler: std/ffi resolve beside the
      # module, and the engine passes absolute paths because wasmtime's guest cwd is "/".
      - name: Self-host fixpoint under wasmtime
        run: |
          set -eu
          w=/tmp/wwasm
          mkdir -p "$w"
          cp -R src std ffi build.toml "$w/" && rm -rf "$w/src/build"
          cp super-c.wasm "$w/gen1.wasm"
          cd "$w"
          gen() {
            "$GITHUB_WORKSPACE/super-c" build --target=wasm --profile=release \
              --transpiler="wasmtime run --dir=/ --argv0 $w/$1 -- $w/$1" -o "$2"
          }
          gen gen1.wasm gen2.wasm
          cp -R build/release/raw /tmp/wasm-gen1
          gen gen2.wasm gen3.wasm
          diff -r /tmp/wasm-gen1 build/release/raw

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-wasm
          path: |
            super-c
            super-c.wasm
          if-no-files-found: error
          retention-days: 1

  wasm-test:
    needs: [resolve, wasm-compile]
    if: github.actor == github.repository_owner
    name: wasm test (${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_shard: "1/2"
            cache_shard: 1
          - test_shard: "2/2"
            cache_shard: 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          cache: ccache-wasm-${{ matrix.cache_shard }}
          sha: ${{ needs.resolve.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-wasm

      - name: Run the test suite against the wasm compiler
        run: |
          chmod +x ./super-c
          SC_TEST_SUPERC="$GITHUB_WORKSPACE/ci/wasm-superc.sh" SC_LEAK_CHECK=fatal ./super-c test --quiet --test-shard=${{ matrix.test_shard }}

  # The wasm compiler ships only after both shards passed with it.
  wasm-package:
    needs: [resolve, wasm-test]
    if: github.actor == github.repository_owner
    name: wasm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-wasm

      - name: Package
        run: |
          set -eu
          name="super-c-wasm32-wasip1"
          mkdir -p "dist/${name}"
          cp super-c.wasm "dist/${name}/"
          cp -R std ffi "dist/${name}/"
          tar -C dist -czf "${name}.tar.gz" "${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: asset-wasm
          path: super-c-wasm32-wasip1.tar.gz
          if-no-files-found: error

  release:
    needs: [resolve, package, wasm-package]
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      # Only the archives: the compiler artifacts the jobs above pass along are not part of a release.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: asset-*
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The SHA the jobs actually built and tested, never a branch name: a tag is only worth anything
          # if it names the commit the suite passed on.
          gh release create "${{ github.event.inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ needs.resolve.outputs.sha }}" \
            --title "${{ github.event.inputs.tag }}" \
            --generate-notes \
            dist/*
