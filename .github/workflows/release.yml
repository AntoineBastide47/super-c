name: Release

# Owner-only, manual-trigger release: builds the `super-c` binary for macOS, Linux and Windows and publishes
# a GitHub Release with one archive per platform.
#
# `commit` is what keeps a run of untagged commits from being all-or-nothing. Left empty the tag lands on the
# head of whatever branch this was dispatched from, so a single broken commit at the tip drags every good one
# behind it into the same release; naming an earlier commit builds, tests and tags exactly that one instead.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. v0.1.0)"
        required: true
        type: string
      commit:
        description: "Commit to build, test and tag (SHA, branch or tag; default: the dispatched branch head)"
        required: false
        type: string

permissions:
  contents: write            # needed to create the tag + release
  actions: write             # the test-durations artifact: read by the shards, replaced by `durations`

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  # Settle what "this release is" exactly once, in one place. Whatever `commit` was given -- a short SHA, a
  # branch, a tag, or nothing at all -- becomes one full SHA that every job below checks out and that the
  # release is finally tagged on. Resolving it per job instead would reopen the hole this input exists to
  # close: a branch that moves mid-run would leave the tag on a commit the suite never built.
  resolve:
    # Only the repository owner may run this.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit, so an input naming an older one resolves

      - id: pick
        # Through the environment, not string interpolation: the input is a shell word here, and pasting it
        # into the script would let one carry its own quoting.
        env:
          WANT: ${{ github.event.inputs.commit }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          sha="$(git rev-parse --verify "${WANT:-$HEAD_SHA}^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Releasing $sha ($(git log -1 --format=%s "$sha"))"

  # The pipeline of macOS, Linux, Windows and wasm: one job builds the compiler, the test shards (three
  # on Windows, the slowest runner, two elsewhere), the x86-64 levels, the correctness gate and the
  # gate's profile builds run in parallel on that binary, and the release binary is built only after all
  # of them pass:
  #
  #   compile --+--> test 1/N .. N/N -----------+
  #             +--> levels (Linux, Windows) ---+--> package --> release
  #             +--> gate ----------------------+
  #             +--> gate profiles -------------+
  #
  # Only a run on main saves caches (the toolchain action restores, `cache-save` saves last), so no
  # other branch evicts main's entries from the repository's cache.
  #
  # Jobs share no files: `compile` uploads the compiler it built, and every later job downloads it (an
  # artifact keeps no file modes, hence the chmod).

  # --- macOS, Linux and Windows -----------------------------------------------------------------------
  compile:
    needs: resolve
    if: github.actor == github.repository_owner
    name: compile (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    # Every step in bash, so the shared steps behave identically on the Windows runner (Git Bash).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          cache: objcache-${{ matrix.target }}-build
          sha: ${{ needs.resolve.outputs.sha }}

      - name: Clean release outputs
        run: rm -rf build src/build ci/build super-c super-c.exe* super-c-boot* smoke*

      - uses: ./.github/actions/bootstrap
        with:
          target: ${{ matrix.target }}

      - name: Build the compiler
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          SC_LEAK_CHECK=fatal "./super-c-boot${BINEXT:-}" build --bootstrap-tags ${cstd:+"$cstd"}
          # Compatibility with a bootstrap older than the `.exe` naming fix: it links the manifest's `bin`
          # verbatim, so on Windows it produces an extensionless PE that nothing can launch. Drop this once
          # a release has shipped with the fix.
          [ -f "./$bin" ] || mv "./super-c" "./$bin"
          test -x "./$bin"

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-${{ matrix.target }}
          path: super-c${{ env.BINEXT }}
          if-no-files-found: error
          retention-days: 1

      - uses: ./.github/actions/cache-save
        with:
          cache: objcache-${{ matrix.target }}-build
          sha: ${{ needs.resolve.outputs.sha }}

  test:
    needs: [resolve, compile]
    if: github.actor == github.repository_owner
    name: test (${{ matrix.target }}, ${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            test_shard: "1/2"
            cache_shard: 1
          - os: macos-latest
            target: macos
            test_shard: "2/2"
            cache_shard: 2
          - os: ubuntu-latest
            target: linux
            test_shard: "1/2"
            cache_shard: 1
          - os: ubuntu-latest
            target: linux
            test_shard: "2/2"
            cache_shard: 2
          - os: windows-latest
            target: windows
            test_shard: "1/3"
            cache_shard: 1
          - os: windows-latest
            target: windows
            test_shard: "2/3"
            cache_shard: 2
          - os: windows-latest
            target: windows
            test_shard: "3/3"
            cache_shard: 3
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          cache: objcache-${{ matrix.target }}-${{ matrix.cache_shard }}
          sha: ${{ needs.resolve.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      # The suite with the binary `compile` produced, so a failure is a failure of this code, not of the
      # bootstrap. Leak-gated: every process in the run exits nonzero if it leaks or double-frees. `test`
      # rebuilds the project first and so relinks `super-c` while `super-c` is the process running: see
      # sc_rename for why that is allowed even on Windows.
      - uses: ./.github/actions/test-durations

      - name: Run the test suite
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          chmod +x "./$bin"
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          dur=tests/durations/${{ matrix.target }}.tsv; [ -f "$dur" ] || dur=tests/durations.tsv # shard balance (test-durations.yml)
          SC_LEAK_CHECK=fatal "./$bin" test --sanitizers --quiet --test-shard=${{ matrix.test_shard }} --test-durations="$dur" \
            --test-record-durations="durations-${{ matrix.target }}-${{ matrix.cache_shard }}.tsv" ${cstd:+"$cstd"}

      # The times this shard measured, for the `durations` job (kept even when the suite fails).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: durations-shard-${{ matrix.target }}-${{ matrix.cache_shard }}
          path: durations-${{ matrix.target }}-${{ matrix.cache_shard }}.tsv
          if-no-files-found: ignore
          retention-days: 1

      - uses: ./.github/actions/cache-save
        with:
          cache: objcache-${{ matrix.target }}-${{ matrix.cache_shard }}
          sha: ${{ needs.resolve.outputs.sha }}

  # The x86-64 levels beside the shards: every vector test at each level, each entry model run checking
  # the entries the baseline run does not reach, and at x86-64-v4 both preferred widths where the
  # runner has AVX-512. The shard cache serves the compiler's rebuild; a level's -march keys its own
  # compiles apart, so the job saves no cache.
  levels:
    needs: [resolve, compile]
    if: github.actor == github.repository_owner
    name: levels (${{ matrix.target }}, ${{ matrix.level }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            level: x86-64-v2
          - os: ubuntu-latest
            target: linux
            level: x86-64-v3
          - os: ubuntu-latest
            target: linux
            level: x86-64-v4
          - os: windows-latest
            target: windows
            level: x86-64-v2
          - os: windows-latest
            target: windows
            level: x86-64-v3
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          cache: objcache-${{ matrix.target }}-1
          sha: ${{ needs.resolve.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      - name: Vector tests at ${{ matrix.level }}
        env:
          SC_SIMD_FEATURES: ${{ matrix.level }}
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          chmod +x "./$bin"
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          if [ "$SC_SIMD_FEATURES" != x86-64-v4 ]; then
            SC_LEAK_CHECK=fatal "./$bin" test --sanitizers --quiet --test-timeout=900 --filter=simd_ ${cstd:+"$cstd"}
          elif grep -qw avx512bw /proc/cpuinfo; then
            for w in 256 512; do
              SC_SIMD_WIDTH=$w SC_LEAK_CHECK=fatal "./$bin" test --sanitizers --quiet --test-timeout=900 --filter=simd_ ${cstd:+"$cstd"}
            done
          else
            echo "x86-64-v4: not run, the runner has no AVX-512"
          fi

  # The correctness gate beside the shards: it needs only the compiler, not their results.
  gate:
    needs: [resolve, compile]
    if: github.actor == github.repository_owner
    name: gate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          cache: objcache-${{ matrix.target }}-gate
          sha: ${{ needs.resolve.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      # ci/gate.sh without its check.sh step, which `compile` and `test` replace, and without the profile
      # builds, which `gate-profiles` runs beside it: the two-generation fixpoint, the worker-count
      # identity under each task-delay seed, and the strict C warnings.
      - name: Run the correctness gate
        run: |
          chmod +x "./super-c${BINEXT:-}"
          sh ci/gate.sh --core

      - uses: ./.github/actions/cache-save
        with:
          cache: objcache-${{ matrix.target }}-gate
          sha: ${{ needs.resolve.outputs.sha }}

  # Every built-in profile but test builds the compiler (ci/gate.sh's last step), beside the gate: the
  # gate's fixpoint proves the two generations emit the same C, so the compiler `compile` built builds
  # them here.
  gate-profiles:
    needs: [resolve, compile]
    if: github.actor == github.repository_owner
    name: gate profiles (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          cache: objcache-${{ matrix.target }}-profiles
          sha: ${{ needs.resolve.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      - name: Build every profile
        run: |
          chmod +x "./super-c${BINEXT:-}"
          sh ci/gate.sh --profiles

      - uses: ./.github/actions/cache-save
        with:
          cache: objcache-${{ matrix.target }}-profiles
          sha: ${{ needs.resolve.outputs.sha }}

  # The release binary, built by the compiler the suite and the gate passed with.
  package:
    needs: [resolve, compile, test, levels, gate, gate-profiles]
    if: github.actor == github.repository_owner
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/toolchain
        with:
          target: ${{ matrix.target }}
          cache: objcache-${{ matrix.target }}-release
          sha: ${{ needs.resolve.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-${{ matrix.target }}

      - name: Build the release binary
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          chmod +x "./$bin"
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          SC_LEAK_CHECK=fatal "./$bin" release ${cstd:+"$cstd"}
          test -x "./$bin"
          if [ "${{ runner.os }}" != Windows ]; then file "./$bin"; fi

      # The concurrency runtime end to end -- OS threads, an Arc'd mutex and atomics across them, coroutines
      # on the worker pool, channels, `select`, the data-parallel API and the timer list -- built and run by
      # the release binary, so the artifact that ships is the one that was exercised.
      - name: Run the concurrency smoke test
        run: |
          set -eu
          bin="super-c${BINEXT:-}"
          smoke="smoke${BINEXT:-}"
          cstd=${SC_CSTD:+--cstd=$SC_CSTD}
          "./$bin" build ci/parallel_smoke.spc -o "$smoke" ${cstd:+"$cstd"}
          SC_LEAK_CHECK=fatal "./$smoke"

      - name: Package
        run: |
          set -eu
          name="super-c-${{ matrix.target }}-$(uname -m)"
          bin="super-c${BINEXT:-}"
          mkdir -p "dist/${name}"
          if [ "${{ matrix.target }}" = windows ]; then
            cp "$bin" "dist/${name}/super-c.exe"
            cp -R std ffi "dist/${name}/"
            ( cd dist && 7z a -bso0 "../${name}.zip" "${name}" )
            echo "ASSET=${name}.zip" >> "$GITHUB_ENV"
          else
            cp "$bin" "dist/${name}/super-c"
            cp -R std ffi "dist/${name}/"
            tar -C dist -czf "${name}.tar.gz" "${name}"
            echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      - uses: ./.github/actions/cache-save
        with:
          cache: objcache-${{ matrix.target }}-release
          sha: ${{ needs.resolve.outputs.sha }}

  # --- wasm ------------------------------------------------------------------------------------------
  # The compiler cross-built to wasm32-wasip1 and put through the SAME suite: every transpile-class
  # invocation runs inside wasmtime (via ci/wasm-superc.sh), the emitted C compiles with the host cc,
  # and the test binaries run natively. WASI has no processes, so the engine's cc and the test runner
  # stay native; the split lives in the wrapper. The self-hosting fixpoint under wasmtime is the
  # exactness oracle on top.
  wasm-compile:
    needs: resolve
    if: github.actor == github.repository_owner
    name: wasm compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          cache: objcache-wasm-build
          sha: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/bootstrap
        with:
          target: linux

      - name: Build the native compiler
        run: SC_LEAK_CHECK=fatal ./super-c-boot build --bootstrap-tags

      # The build engine cross-compiles with the wasi-sdk (sysroot, emulation libraries, stack size).
      - name: Build the wasm compiler
        run: ./super-c build --target=wasm --profile=release -o super-c.wasm

      - uses: actions/upload-artifact@v7
        with:
          name: compiler-wasm
          path: |
            super-c
            super-c.wasm
          if-no-files-found: error
          retention-days: 1

      - uses: ./.github/actions/cache-save
        with:
          cache: objcache-wasm-build
          sha: ${{ needs.resolve.outputs.sha }}

  # The wasm compiler's own checks, beside its test shards: they need only the two compilers.
  wasm-checks:
    needs: [resolve, wasm-compile]
    if: github.actor == github.repository_owner
    name: wasm checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          cache: objcache-wasm-checks
          sha: ${{ needs.resolve.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-wasm

      - name: Make the native compiler executable
        run: chmod +x ./super-c

      # The vector conformance lane: every vector test program, and the vector generator model's fixed
      # seeds, build for wasm32 with +simd128, run under wasmtime, and match the same program built
      # without the feature or the scalar model.
      - name: Vector tests on wasm32 with simd128
        run: |
          SC_SIMD_LANE=wasm SC_LEAK_CHECK=fatal ./super-c test --sanitizers --quiet --test-timeout=900 --filter=simd_
          SC_SIMD_LANE=wasm SC_LEAK_CHECK=fatal ./super-c test --sanitizers --quiet --test-timeout=900 --filter=gen_vector_seeds

      # The self-hosting fixpoint, on wasm: the build engine builds gen2 from the whole compiler with gen1
      # (the artifact) as its transpiler under wasmtime, then gen3 with gen2 as its transpiler, and
      # gen2's emission must be byte-identical to gen1's. WASI has no processes, so the native engine
      # runs the transpile step through `--transpiler` and compiles and links with its own wasm target
      # flags. Emission is path-dependent (hashes mix path strings), so both emit from the SAME project
      # copy. (No byte-diff against the native binary: instance homing follows hash orders that differ
      # between 32- and 64-bit hosts.) The copy carries each transpiler: std/ffi resolve beside the
      # module, and the engine passes absolute paths because wasmtime's guest cwd is "/".
      - name: Self-host fixpoint under wasmtime
        run: |
          set -eu
          w=/tmp/wwasm
          mkdir -p "$w"
          cp -R src std ffi build.toml "$w/" && rm -rf "$w/src/build"
          cp super-c.wasm "$w/gen1.wasm"
          cd "$w"
          gen() {
            "$GITHUB_WORKSPACE/super-c" build --target=wasm --profile=release \
              --transpiler="wasmtime run --dir=/ --argv0 $w/$1 -- $w/$1" -o "$2"
          }
          gen gen1.wasm gen2.wasm
          cp -R build/release/raw /tmp/wasm-gen1
          gen gen2.wasm gen3.wasm
          diff -r /tmp/wasm-gen1 build/release/raw

      - uses: ./.github/actions/cache-save
        with:
          cache: objcache-wasm-checks
          sha: ${{ needs.resolve.outputs.sha }}

  wasm-test:
    needs: [resolve, wasm-compile]
    if: github.actor == github.repository_owner
    name: wasm test (${{ matrix.test_shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_shard: "1/2"
            cache_shard: 1
          - test_shard: "2/2"
            cache_shard: 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/toolchain
        with:
          target: wasm
          cache: objcache-wasm-${{ matrix.cache_shard }}
          sha: ${{ needs.resolve.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-wasm

      - uses: ./.github/actions/test-durations

      - name: Run the test suite against the wasm compiler
        run: |
          chmod +x ./super-c
          dur=tests/durations/wasm.tsv; [ -f "$dur" ] || dur=tests/durations.tsv # shard balance (test-durations.yml)
          SC_TEST_SUPERC="$GITHUB_WORKSPACE/ci/wasm-superc.sh" SC_LEAK_CHECK=fatal ./super-c test --sanitizers --quiet --test-shard=${{ matrix.test_shard }} --test-durations="$dur" \
            --test-record-durations="durations-wasm-${{ matrix.cache_shard }}.tsv"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: durations-shard-wasm-${{ matrix.cache_shard }}
          path: durations-wasm-${{ matrix.cache_shard }}.tsv
          if-no-files-found: ignore
          retention-days: 1

      - uses: ./.github/actions/cache-save
        with:
          cache: objcache-wasm-${{ matrix.cache_shard }}
          sha: ${{ needs.resolve.outputs.sha }}

  # The test times every shard above recorded replace the repository's `test-durations` artifact, which
  # the next run's shards split by (.github/actions/test-durations), even when a shard failed.
  durations:
    needs: [resolve, test, wasm-test]
    if: always() && github.actor == github.repository_owner
    name: test durations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: ./.github/actions/test-durations-save
        with:
          shards: macos=2 linux=2 windows=3 wasm=2

  # The wasm compiler ships only after both shards and its checks passed with it.
  wasm-package:
    needs: [resolve, wasm-test, wasm-checks]
    if: github.actor == github.repository_owner
    name: wasm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: compiler-wasm

      - name: Package
        run: |
          set -eu
          name="super-c-wasm32-wasip1"
          mkdir -p "dist/${name}"
          cp super-c.wasm "dist/${name}/"
          cp -R std ffi "dist/${name}/"
          tar -C dist -czf "${name}.tar.gz" "${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: asset-wasm
          path: super-c-wasm32-wasip1.tar.gz
          if-no-files-found: error

  release:
    needs: [resolve, package, wasm-package]
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      # Only the archives: the compiler artifacts the jobs above pass along are not part of a release.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: asset-*
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The SHA the jobs actually built and tested, never a branch name: a tag is only worth anything
          # if it names the commit the suite passed on.
          gh release create "${{ github.event.inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ needs.resolve.outputs.sha }}" \
            --title "${{ github.event.inputs.tag }}" \
            --generate-notes \
            dist/*
