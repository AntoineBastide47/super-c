name: Save ccache
description: >
  The last step of a CI job that keeps a ccache: saves the job's ccache directory under the key the
  toolchain action restored (`<cache>-<sha>`), on main only. A run on another branch saves nothing, so it
  cannot evict main's entries from the repository's cache.
inputs:
  cache:
    description: "the ccache key prefix the job passed to the toolchain action"
    required: true
  sha:
    description: "the commit under test, the last part of the ccache key"
    required: true
runs:
  using: composite
  steps:
    - name: Save ccache (main)
      if: github.ref == 'refs/heads/main'
      uses: actions/cache/save@v6
      with:
        path: .ccache
        key: ${{ inputs.cache }}-${{ inputs.sha }}
