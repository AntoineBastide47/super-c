name: Bootstrap compiler
description: >
  The latest release's compiler for `target`, as ./super-c-boot (.exe on Windows). It lands beside the
  checkout under its own name, never as `super-c`: it resolves std/ffi relative to its OWN executable, so
  at the repo root it picks up the current std/ffi (which is the point of --bootstrap-tags), and a
  distinct name keeps it intact instead of having the first build replace the binary producing it. Sets
  SC_BOOT_CSTD to the `--cstd` flag a release older than the native backend needs on Windows.
inputs:
  target:
    description: "linux, macos or windows (the release archive's platform)"
    required: true
outputs:
  tag:
    description: "the release tag the compiler came from"
    value: ${{ steps.fetch.outputs.tag }}
runs:
  using: composite
  steps:
    - name: Fetch bootstrap super-c from the latest release
      id: fetch
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET: ${{ inputs.target }}
      run: |
        set -eu
        arch="$(uname -m)"
        name="super-c-${TARGET}-${arch}"
        boot="super-c-boot${BINEXT:-}"
        # One tag for the download and the output, so a release published meanwhile cannot split them.
        tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        if [ "$TARGET" = windows ]; then
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "${name}.zip" --dir . --clobber
          7z x -y "${name}.zip" >/dev/null
          if [ -f "${name}/super-c.exe" ]; then cp "${name}/super-c.exe" "$boot"; else cp "${name}.exe" "$boot"; fi
        else
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "${name}.tar.gz" --dir . --clobber
          tar xzf "${name}.tar.gz"
          if [ -f "${name}/super-c" ]; then cp "${name}/super-c" "$boot"; else cp "${name}" "$boot"; fi
          chmod +x "$boot"
        fi
        test -x "./$boot"
        # A release older than the native backend (no `--emit-c`) builds through its C compiler, which on
        # Windows needs the toolchain action's C standard (SC_CSTD): SC_BOOT_CSTD is its flag, empty else.
        if [ -n "${SC_CSTD:-}" ] && ! "./$boot" --help 2>&1 | grep -q -- '--emit-c'; then
          echo "SC_BOOT_CSTD=--cstd=$SC_CSTD" >> "$GITHUB_ENV"
        fi
