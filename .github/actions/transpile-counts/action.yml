name: Transpile counts
description: >
  The transpile work of this commit's compiler against the last release's, on the same input. Each is
  built by clang with its frontend counters (build.toml `[profile.counts]`, the release flags; the last
  release's sources get the section when they lack it): this commit's by the compiler under test, the last
  release's from its tagged sources by its own binary. Both then transpile this commit's sources with
  `--bootstrap-tags` (which the last release always builds: the bootstrap step), every cache off, on one
  worker, and llvm-profdata totals each run's counters. A count repeats within 0.0001% and covers the
  compiler's own code only: the C compile, libc and the kernel are not counted. A growth of WARN_PCT
  percent or more is a warning; LIMIT_PCT percent or more is an error, and the release then waits for an
  approval (.github/actions/transpile-counts-save). Uploads `<target>.tsv`, `<target>-base.tsv` (counts.py
  summarize), both `.profdata` files, the summary table `<target>.md` and `<target>.verdict` (`ok`, `warn`
  or `over`) as the `counts-part-<target>` artifact for .github/actions/transpile-counts-save. Needs the
  compiler under test at ./super-c and the bootstrap action's ./super-c-boot (.exe on Windows), and on
  Windows the toolchain action's `llvm-mingw: true`.
inputs:
  target:
    description: "linux, macos or windows"
    required: true
  sha:
    description: "the commit under test"
    required: true
  base-tag:
    description: "the release tag of ./super-c-boot (the bootstrap action's `tag` output)"
    required: true
runs:
  using: composite
  steps:
    - name: Count the transpile work
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        SHA: ${{ inputs.sha }}
        BASE_TAG: ${{ inputs.base-tag }}
        WARN_PCT: "0.1"
        LIMIT_PCT: "1"
      run: |
        set -eu
        x=${BINEXT:-}
        cstd=${SC_CSTD:+--cstd=$SC_CSTD}
        # Each clang with the llvm-profdata of its own version: the raw profile format is per version.
        case "$RUNNER_OS" in
          Linux) cc=clang; pd="llvm-profdata-$(clang -dumpversion | cut -d. -f1)" ;;
          macOS) cc=cc; pd="$(xcrun -f llvm-profdata)" ;;
          *) cc="$LLVM_MINGW/x86_64-w64-mingw32-clang.exe"; pd="$LLVM_MINGW/llvm-profdata.exe" ;;
        esac
        ccv=$("$cc" --version | head -1)
        py=$(command -v python3 || command -v python)
        w="$RUNNER_TEMP/counts"
        rm -rf "$w" && mkdir -p "$w/out"
        chmod +x "./super-c$x" "./super-c-boot$x"

        # Both counts compilers sit two levels under the checkout, so both find this commit's std and ffi.
        "./super-c$x" build --profile=counts --cc="$cc" ${cstd:+"$cstd"} -o "build/counts/super-c-counts$x"
        git fetch -q --depth=1 origin "refs/tags/$BASE_TAG:refs/tags/$BASE_TAG"
        base="$RUNNER_TEMP/counts-base"
        rm -rf "$base" && mkdir -p "$base"
        # No `tar -C "$base"`: Windows GNU tar reads `D:\...` as a remote `host:path`.
        git archive "$BASE_TAG" | (cd "$base" && tar -x)
        if ! grep -q '^\[profile\.counts\]' "$base/build.toml"; then
          { echo; awk '/^\[/ { p = ($0 == "[profile.counts]") } p' build.toml; } >> "$base/build.toml"
        fi
        cp "super-c-boot$x" "$base/"
        ( cd "$base" && "./super-c-boot$x" build --profile=counts --cc="$cc" ${cstd:+"$cstd"} -o "build/counts/super-c-counts$x" )
        mkdir -p build/counts-base
        cp "$base/build/counts/super-c-counts$x" "build/counts-base/super-c-counts$x"

        # One counted transpile of this commit: $1 the output name, $2 the compiler, $3 its label.
        count() {
          mkdir -p "$w/raw-$1"
          set +e
          env SC_NO_CACHE=1 CCACHE_DISABLE=1 SC_NO_EMIT_CACHE=1 SC_NO_TU_CACHE=1 SC_LINK=cc LLVM_PROFILE_FILE="$w/raw-$1/%p.profraw" \
            "$2" build --profile=debug --jobs=1 --cc=true --bootstrap-tags --out-dir="$w/tree-$1" >/dev/null 2>"$w/$1.err"
          status=$?
          set -e
          # `--cc=true` compiles and links nothing (SC_LINK=cc keeps the link with it), so the build ends at
          # the binary it never made.
          if [ "$status" -ne 1 ] || ! grep -q "cannot move .* into place" "$w/$1.err"; then
            cat "$w/$1.err"
            echo "::error::the counted transpile of $3 failed (exit $status)"
            exit 1
          fi
          "$pd" merge -o "$w/out/$1.profdata" "$w/raw-$1"/*.profraw
          "$pd" merge --text -o "$w/$1.txt" "$w/out/$1.profdata"
          "$py" -I "$GITHUB_ACTION_PATH/counts.py" summarize "$w/$1.txt" "$w/out/$1.tsv" "$3" "$ccv"
        }
        count "$TARGET-base" "./build/counts-base/super-c-counts$x" "$BASE_TAG ($(git rev-parse --short "$BASE_TAG^{commit}"))"
        count "$TARGET" "./build/counts/super-c-counts$x" "(${SHA:0:7})"

        "$py" -I "$GITHUB_ACTION_PATH/counts.py" check "$TARGET" "$w/out/$TARGET-base.tsv" "$w/out/$TARGET.tsv" \
          "$w/out/$TARGET.md" "$WARN_PCT" "$LIMIT_PCT" "$w/out/$TARGET.verdict"
        cat "$w/out/$TARGET.md" >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: counts-part-${{ inputs.target }}
        path: ${{ runner.temp }}/counts/out
        if-no-files-found: ignore
        retention-days: 1
