name: Toolchain
description: >
  The C toolchain and object cache of one CI job: the platform's cache base (`~/.super-c/cache`: each
  project's cache root, the script builds' `.scripts` and the tests' `.tests`, `SC_TEST_CACHE_DIR`), the
  newest `objcache-<target>-<sha>`, with the job's own delta (`objdelta-<target>-<role>-<sha>`) over it
  when it has a `role`; the platform's C compiler (the preinstalled cc on Linux and macOS, mingw-w64
  gcc on Windows), for `target: wasm` the wasi-sdk and wasmtime, and with `llvm-mingw: true` on Windows
  the llvm-mingw clang (`LLVM_MINGW`, its bin directory). Only a release run on main saves (`save:
  true`): the installation caches here after installing, the object cache in the job's last step
  (`./.github/actions/cache-save`), so no other workflow or branch adds to the repository's cache and
  evicts the release's entries.
inputs:
  target:
    description: "linux, linux_arm64, macos, windows or wasm"
    required: true
  sha:
    description: "the commit under test, the last part of the object cache key"
    required: true
  role:
    description: "a job outside the platform cache (gate, counts, checks): its own delta is restored too"
    required: false
    default: ""
  save:
    description: "true in the release workflow: the job saves the installation caches and its cache delta on main"
    required: false
    default: "false"
  llvm-mingw:
    description: "Windows: also install llvm-mingw, whose clang has the mingw profile runtime"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # One cache per platform, which the release's `caches` job merges from its jobs' deltas.
    - name: Restore object cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.super-c/cache
        key: objcache-${{ inputs.target }}-${{ inputs.sha }}
        restore-keys: objcache-${{ inputs.target }}-

    # What the job's cache delta is measured against (.github/actions/cache-save/delta.py): the platform
    # cache, before the job's own delta goes over it.
    - name: Snapshot the object cache
      if: inputs.save == 'true' && github.ref == 'refs/heads/main'
      shell: bash
      run: |
        py=$(command -v python3 || command -v python)
        "$py" -I "$GITHUB_ACTION_PATH/../cache-save/delta.py" snapshot "$RUNNER_TEMP/sc-cache.lst"

    - name: Restore the job's cache delta
      id: delta
      if: inputs.role != ''
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/sc-cache-delta.tar
        key: objdelta-${{ inputs.target }}-${{ inputs.role }}-${{ inputs.sha }}
        restore-keys: objdelta-${{ inputs.target }}-${{ inputs.role }}-

    # Its files over the platform cache; the files it lists as deleted stay, the platform cache rules them.
    - name: Apply the job's cache delta
      if: inputs.role != '' && steps.delta.outputs.cache-matched-key != ''
      shell: bash
      run: |
        py=$(command -v python3 || command -v python)
        "$py" -I "$GITHUB_ACTION_PATH/../cache-save/delta.py" apply "$RUNNER_TEMP/sc-cache-delta.tar" --keep

    # `super-c test` gives the compilers its tests start this cache base, inside the restored and saved
    # cache, so the fixtures' objects carry over between runs (unset, a run deletes its own at its end).
    - name: Keep the test cache
      shell: bash
      run: |
        h=$HOME
        if [ "$RUNNER_OS" = Windows ]; then h=$(cygpath -m "$HOME"); fi
        echo "SC_TEST_CACHE_DIR=$h/.super-c/cache/.tests" >> "$GITHUB_ENV"

    - name: Restore Homebrew downloads (macOS)
      id: brew
      if: runner.os == 'macOS'
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/Library/Caches/Homebrew
          ~/Library/Caches/Homebrew/downloads
        key: cc-brew-${{ runner.os }}-${{ hashFiles('build.toml') }}
        restore-keys: cc-brew-${{ runner.os }}-

    - name: Set up C compiler (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        if ! command -v cc >/dev/null 2>&1; then
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "CC=clang" >> "$GITHUB_ENV"
        fi

    - name: Save Homebrew downloads (macOS, release on main)
      if: runner.os == 'macOS' && inputs.save == 'true' && github.ref == 'refs/heads/main' && steps.brew.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/Library/Caches/Homebrew
          ~/Library/Caches/Homebrew/downloads
        key: cc-brew-${{ runner.os }}-${{ hashFiles('build.toml') }}

    # The hosted Linux images ship a C compiler. No apt cache: the archive directory is root-owned, so the
    # cache action can neither read it to save nor write it to restore.
    - name: Set up C compiler (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v cc >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y build-essential
        fi

    - name: Restore mingw-w64 install (Windows)
      id: mingw
      if: runner.os == 'Windows'
      uses: actions/cache/restore@v6
      with:
        path: |
          C:\ProgramData\chocolatey\lib\mingw
          C:\ProgramData\mingw64
          C:\tools\mingw64
        key: mingw-w64-${{ runner.os }}-choco-v3
        restore-keys: mingw-w64-${{ runner.os }}-

    # Windows ships no Unix C toolchain; pull in mingw-w64 gcc + GNU make. The compiler source is
    # mingw-clean: realpath/dirent/unistd are provided and it makes no real fork/popen/mmap call.
    - name: Set up mingw-w64 (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        find_mingw_bin() {
          { find /c/ProgramData/mingw64 /c/ProgramData/chocolatey/lib/mingw /c/tools -path '*/mingw64/bin' -type d 2>/dev/null || true; } |
            while read -r dir; do
              if [ -x "$dir/gcc.exe" ] || [ -x "$dir/gcc" ]; then
                echo "$dir"
                break
              fi
            done
        }
        mingw_bin="$(find_mingw_bin)"
        if [ -z "$mingw_bin" ]; then
          choco install -y --no-progress mingw
          mingw_bin="$(find_mingw_bin)"
        fi
        test -n "$mingw_bin"
        cygpath -w "$mingw_bin" >> "$GITHUB_PATH"
        echo "CC=gcc" >> "$GITHUB_ENV"
        echo "BINEXT=.exe" >> "$GITHUB_ENV"

    - name: Save mingw-w64 install (Windows, release on main)
      if: runner.os == 'Windows' && inputs.save == 'true' && github.ref == 'refs/heads/main' && steps.mingw.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          C:\ProgramData\chocolatey\lib\mingw
          C:\ProgramData\mingw64
          C:\tools\mingw64
        key: mingw-w64-${{ runner.os }}-choco-v3

    # The preinstalled LLVM ships its profile runtime for the msvc target only; llvm-mingw builds it for
    # mingw. A pinned release, checked against the hash recorded here.
    - name: Restore llvm-mingw (Windows)
      id: llvm-mingw
      if: runner.os == 'Windows' && inputs.llvm-mingw == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ~/llvm-mingw
        key: llvm-mingw-20261020-ucrt-x86_64-v1

    - name: Set up llvm-mingw (Windows)
      if: runner.os == 'Windows' && inputs.llvm-mingw == 'true'
      shell: bash
      run: |
        set -eu
        name=llvm-mingw-20261020-ucrt-x86_64
        if [ ! -x "$HOME/llvm-mingw/bin/x86_64-w64-mingw32-clang.exe" ]; then
          curl -sSfL -o "$RUNNER_TEMP/$name.zip" "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/$name.zip"
          echo "fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd  $RUNNER_TEMP/$name.zip" | sha256sum -c -
          rm -rf "$HOME/llvm-mingw" "$HOME/$name"
          7z x -y -bso0 -o"$HOME" "$RUNNER_TEMP/$name.zip"
          mv "$HOME/$name" "$HOME/llvm-mingw"
        fi
        echo "LLVM_MINGW=$(cygpath -m "$HOME/llvm-mingw/bin")" >> "$GITHUB_ENV"

    - name: Save llvm-mingw (Windows, release on main)
      if: runner.os == 'Windows' && inputs.llvm-mingw == 'true' && inputs.save == 'true' && github.ref == 'refs/heads/main' && steps.llvm-mingw.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/llvm-mingw
        key: llvm-mingw-20261020-ucrt-x86_64-v1

    - name: Restore wasi toolchain
      id: wasi
      if: inputs.target == 'wasm'
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/wasi-sdk
          ~/.wasmtime
        key: wasi-toolchain-sdk25-wasmtime49.0.2-v1

    - name: Set up wasi-sdk + wasmtime
      if: inputs.target == 'wasm'
      shell: bash
      run: |
        set -eu
        if [ ! -x "$HOME/wasi-sdk/bin/clang" ]; then
          curl -sSfL -o /tmp/wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
          mkdir -p "$HOME/wasi-sdk"
          tar -xzf /tmp/wasi-sdk.tar.gz -C "$HOME/wasi-sdk" --strip-components=1
        fi
        # A pinned release tarball: the install script resolves "latest" through the GitHub API and
        # installs nothing when that lookup fails.
        if [ ! -x "$HOME/.wasmtime/bin/wasmtime" ]; then
          curl -sSfL -o /tmp/wasmtime.tar.xz \
            https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.2/wasmtime-v49.0.2-x86_64-linux.tar.xz
          mkdir -p "$HOME/.wasmtime/bin"
          tar -xJf /tmp/wasmtime.tar.xz -C "$HOME/.wasmtime/bin" --strip-components=1 wasmtime-v49.0.2-x86_64-linux/wasmtime
        fi
        "$HOME/.wasmtime/bin/wasmtime" --version
        echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
        echo "WASI_SDK_PATH=$HOME/wasi-sdk" >> "$GITHUB_ENV"

    - name: Save wasi toolchain (release on main)
      if: inputs.target == 'wasm' && inputs.save == 'true' && github.ref == 'refs/heads/main' && steps.wasi.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          ~/wasi-sdk
          ~/.wasmtime
        key: wasi-toolchain-sdk25-wasmtime49.0.2-v1
