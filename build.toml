bin = "super-c"
root = "src/main.spc"
std_internals = true
# The SDK examples build once a client vendors the compiler (tests/api/api_sdk_test.spc builds them so).
lint-exclude = ["docs/compiler-api/examples"]

[command.bootstrap]
run = [
    "./super-c build --bootstrap-tags -o stage1-super-c",
    "./stage1-super-c build",
    "rm -rf stage1-super-c",
]

[command.profile]
run = [
    "./super-c bench --no-run --filter=self_transpile",
    "samply record --rate 1000 build/bench-bin --in-process",
]

[command.gate]
run = ["sh ci/gate.sh"]

[command.gen]
env = { SC_GEN_RUNS = "200" }
run = ["./super-c test --quiet --filter=gen_random_run"]
