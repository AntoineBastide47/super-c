bin = "super-c"
root = "src/main.spc"

[command.bootstrap]
run = [
    "./super-c build --bootstrap-tags -o stage1-super-c",
    "./stage1-super-c build",
    "rm -rf stage1-super-c",
]

[command.profile]
run = [
    "./super-c bench --no-run",
    "samply record --rate 1000 build/bench-bin",
]

[command.gate]
run = ["sh ci/gate.sh"]

[command.perf]
run = ["sh ci/perf_gate.sh"]

[command.matrix]
run = ["sh ci/bench_matrix.sh"]
