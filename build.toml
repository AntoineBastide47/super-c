bin = "super-c"
root = "src/main.spc"

# Output shard policy (schema: changing a count rewrites every shard of that module).
# A module absent here emits one TU and one instance shard; counts come from the measured
# emitted size (about one shard per 256 KiB of C) so the C compile's critical path stays short.
# Commented out until a release ships a compiler that reads these sections: the release that
# bootstraps the build rejects them at the TOML level. Restore once that release exists.
# [shards]
# "typechecker::typechecker" = 6
# "emit::cemit" = 4
# "driver::emit" = 3
# "ast::parser" = 3
# "ir::interp" = 2
# "ir::lower" = 2
# "lsp::server" = 2
# "borrowck::borrowck" = 2
#
# [instance-shards]
# "__std::vector" = 2

[command.bootstrap]
run = [
    "./super-c build --bootstrap-tags -o stage1-super-c",
    "./stage1-super-c build",
    "rm -rf stage1-super-c",
]

[command.profile]
run = [
    "./super-c bench --no-run",
    "samply record --rate 1000 build/bench-bin",
]

[command.gate]
run = ["sh ci/gate.sh"]

[command.perf]
run = ["sh ci/perf_gate.sh"]

[command.matrix]
run = ["sh ci/bench_matrix.sh"]
