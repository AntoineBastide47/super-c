bin = "super-c"
root = "src/main.spc"
std_internals = true

[command.bootstrap]
run = [
    "./super-c build --bootstrap-tags -o stage1-super-c",
    "./stage1-super-c build",
    "rm -rf stage1-super-c",
]

[command.profile]
run = [
    "./super-c bench --no-run --filter=self_transpile",
    "samply record --rate 1000 build/bench-bin --in-process",
]

[command.gate]
run = ["sh ci/gate.sh"]

[command.gen]
env = { SC_GEN_RUNS = "200" }
run = ["./super-c test --quiet --filter=gen_random_run"]

# The release flags with clang's frontend counters: the compiler whose counter total measures the
# transpile work in CI (.github/actions/transpile-counts). Build it with a clang `--cc`.
[profile.counts]
opt-level = 3
cflags = ["-DNDEBUG", "-finline-functions", "-fomit-frame-pointer", "-fPIE", "-fprofile-instr-generate"]
ldflags = ["-fprofile-instr-generate"]
link-args = ["-O2"]
strip = true
lto = "auto"
